name: Staged Pattern Canary Expansion Activation Monitoring v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  push:
    branches:
      - feature/staged-pattern-canary-expansion-activation-monitoring-v0.1
      - import/decision-intelligence-v0.5-qualified-set

permissions:
  contents: read

jobs:
  validate-staged-pattern-canary-expansion:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve canonical comparison range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_REF_NAME}" == "feature/staged-pattern-canary-expansion-activation-monitoring-v0.1" ]]; then
            git fetch --no-tags origin import/decision-intelligence-v0.5-qualified-set:refs/remotes/origin/import/decision-intelligence-v0.5-qualified-set
            BASE="$(git merge-base HEAD origin/import/decision-intelligence-v0.5-qualified-set)"
            HEAD="${GITHUB_SHA}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${GITHUB_SHA}"
          fi
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$HEAD^{commit}"
          echo "STEP12_BASE=$BASE" >> "$GITHUB_ENV"
          echo "STEP12_HEAD=$HEAD" >> "$GITHUB_ENV"
          echo "STEP12_COMPARISON_BASE=$BASE"
          echo "STEP12_COMPARISON_HEAD=$HEAD"

      - name: Enforce Step 12 introduction scope or protect Step 12 artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE="$STEP12_BASE"
          HEAD="$STEP12_HEAD"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          owned=(
            "contracts/staged-pattern-canary-expansion-activation-monitoring-v0.1.json"
            "packages/intelligence-engine/src/staged-pattern-canary-expansion-activation-monitoring.mjs"
            "packages/intelligence-engine/tests/staged-pattern-canary-expansion-activation-monitoring.test.mjs"
            "packages/intelligence-engine/docs/STAGED_PATTERN_CANARY_EXPANSION_ACTIVATION_MONITORING_V0_1.md"
            ".github/workflows/staged-pattern-canary-expansion-activation-monitoring-v0.1.yml"
          )
          if ! git cat-file -e "$BASE:contracts/staged-pattern-canary-expansion-activation-monitoring-v0.1.json" 2>/dev/null; then
            declare -A seen=()
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"; matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" == "A" ]] || { echo "STEP12_INTRODUCTION_FILE_MUST_BE_ADDED: $row"; exit 1; }
                  seen["$path"]=1; matched=true; break
                fi
              done
              [[ "$matched" == true ]] || { echo "STEP12_UNEXPECTED_INTRODUCTION_CHANGE: $row"; exit 1; }
            done
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP12_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP12_INTRODUCTION_FILE_SET_INCOMPLETE"; exit 1; }
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  case "$status" in D|R*) echo "STEP12_OWNED_ARTIFACT_DELETION_OR_RENAME_FORBIDDEN: $row"; exit 1 ;; esac
                fi
              done
            done
          fi
          echo "STEP12_SCOPE_GUARD=PASS"

      - name: Validate Step 10-12 contracts, P002 and Gate6 ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s10=json.loads(Path('contracts/controlled-pattern-canary-activation-rollback-v0.1.json').read_text())
          s11=json.loads(Path('contracts/pattern-canary-expansion-rejection-governance-v0.1.json').read_text())
          s12=json.loads(Path('contracts/staged-pattern-canary-expansion-activation-monitoring-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          g6=json.loads(Path('packages/gate6/gate6_manifest.json').read_text())
          assert s10['contract_id']=='CONTROLLED_PATTERN_CANARY_ACTIVATION_ROLLBACK_V0_1'
          assert s10['status']=='STEP_10_IMPLEMENTED'
          assert s10['canary_boundary']['maximum_prediction_unit_routing_fraction']==0.05
          assert s11['contract_id']=='PATTERN_CANARY_EXPANSION_REJECTION_GOVERNANCE_V0_1'
          assert s11['status']=='STEP_11_IMPLEMENTED'
          assert s11['next_stage']=='STEP_12_STAGED_CANARY_EXPANSION_ACTIVATION_AND_MONITORING'
          assert s11['expansion_boundary']['next_stage_maximum_routing_fraction']==0.10
          assert s11['expansion_boundary']['maximum_absolute_probability_shift']==0.02
          assert s11['expansion_boundary']['approval_is_not_activation'] is True
          assert s12['contract_id']=='STAGED_PATTERN_CANARY_EXPANSION_ACTIVATION_MONITORING_V0_1'
          assert s12['status']=='STEP_12_IMPLEMENTED'
          assert s12['inputs']['required_step11_state']=='NEXT_CANARY_STAGE_APPROVED_NOT_ACTIVATED'
          assert s12['inputs']['required_step11_decision']=='APPROVE_NEXT_CANARY_STAGE'
          assert s12['inputs']['same_step10_canary_authorization_required'] is True
          assert s12['inputs']['same_shadow_plan_calibration_and_routing_seed_required'] is True
          assert s12['activation_boundary']['previous_stage_maximum_routing_fraction']==0.05
          assert s12['activation_boundary']['staged_expansion_maximum_routing_fraction']==0.10
          assert s12['activation_boundary']['maximum_absolute_probability_shift']==0.02
          assert s12['activation_boundary']['probability_influence_cap_may_increase'] is False
          assert s12['activation_boundary']['routing_seed_must_be_preserved'] is True
          assert s12['activation_boundary']['retroactive_routing_allowed'] is False
          assert s12['activation_boundary']['post_kickoff_routing_allowed'] is False
          assert s12['activation_boundary']['automatic_further_expansion'] is False
          assert s12['activation_boundary']['automatic_full_promotion'] is False
          assert s12['monitoring']['minimum_new_stage_routed_settled_n']==30
          assert s12['monitoring']['minimum_expansion_band_routed_settled_n']==30
          assert s12['monitoring']['maximum_ece_degradation']==0.01
          assert s12['monitoring']['additional_alpha_spent'] is False
          assert s12['rollback']['routing_fraction_after_rollback']==0
          assert s12['rollback']['probability_influence_after_rollback']==0
          assert s12['decision_boundary']['production_decision_weight']==0
          assert s12['decision_boundary']['capital_use_authorized'] is False
          assert s12['real_evidence_boundary']['synthetic_unit_test_rows_may_count_as_real_step12_evidence'] is False
          assert s12['real_evidence_boundary']['real_step12_activation_claimed_by_implementation'] is False
          assert s12['governance']['p002_changed'] is False
          assert s12['governance']['gate1_to_gate6_ownership_changed'] is False
          assert s12['governance']['gate6_capital_lock_preserved'] is True
          assert s12['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['independent_validation_min_n']==30
          assert p002['capital_effect']=='NONE_UNTIL_GOVERNED_EVIDENCE'
          assert g6['gate']=='Gate 6 — Capital & Risk Engine'
          assert 'LOCKED' in g6['capital_modes']
          print('STEP10_TO_STEP12_CONTRACT_CHAIN=PASS')
          print('STEP12_10_PERCENT_MAX_ROUTING=PASS')
          print('STEP12_2PP_INFLUENCE_CAP_PRESERVED=PASS')
          print('STEP12_EXPANSION_BAND_INDEPENDENT_MIN_N=PASS')
          print('STEP12_NO_HINDSIGHT_ROUTING_BOUNDARY=PASS')
          print('STEP12_NO_AUTOMATIC_FULL_PROMOTION=PASS')
          print('GATE6_CAPITAL_OWNER_PRESERVED=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Run Step 10 regression
        run: node --test packages/intelligence-engine/tests/controlled-pattern-canary-activation-rollback.test.mjs

      - name: Run Step 11 regression
        run: node --test packages/intelligence-engine/tests/pattern-canary-expansion-rejection-governance.test.mjs

      - name: Run Step 12 tests
        run: node --test packages/intelligence-engine/tests/staged-pattern-canary-expansion-activation-monitoring.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$STEP12_BASE"
          HEAD="$STEP12_HEAD"
          mkdir -p artifacts/staged-pattern-canary-expansion-activation-monitoring-v0.1
          rm -rf /tmp/step12-base /tmp/step12-head
          git worktree add --detach /tmp/step12-base "$BASE"
          git worktree add --detach /tmp/step12-head "$HEAD"
          set +e
          (cd /tmp/step12-base/packages/intelligence-engine && npm test) > /tmp/step12-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step12-head/packages/intelligence-engine && npm test) > /tmp/step12-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s\n' "$BASE_RC" > /tmp/step12-base.rc
          printf '%s\n' "$HEAD_RC" > /tmp/step12-head.rc
          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          def failures(path):
            out=[]
            for line in Path(path).read_text(errors='replace').splitlines():
              t=line.strip(); m=tap.match(t) or glyph.match(t)
              if m: out.append(m.group(1).strip())
            return sorted(set(out))
          brc=int(Path('/tmp/step12-base.rc').read_text()); hrc=int(Path('/tmp/step12-head.rc').read_text())
          base=failures('/tmp/step12-base.log'); head=failures('/tmp/step12-head.log')
          if brc!=0 and not base: raise SystemExit('STEP12_UNPARSED_CANONICAL_BASE_TEST_FAILURE_DEBT')
          if hrc!=0 and not head: raise SystemExit('STEP12_UNPARSED_HEAD_TEST_FAILURE_DEBT')
          if brc!=hrc: raise SystemExit('STEP12_NPM_TEST_EXIT_CODE_CHANGED')
          if base!=head: raise SystemExit('STEP12_REGRESSION_FAILURE_SET_CHANGED')
          summary={'comparison':'CANONICAL_BASE_VS_STEP12_HEAD','node_version':'20','base_npm_test_rc':brc,'head_npm_test_rc':hrc,'base_failure_n':len(base),'head_failure_n':len(head),'base_failures':base,'head_failures':head,'new_failure_names':sorted(set(head)-set(base)),'removed_failure_names':sorted(set(base)-set(head)),'failure_name_delta_zero':base==head}
          Path('artifacts/staged-pattern-canary-expansion-activation-monitoring-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          echo "STEP12_REGRESSION_DELTA=0"

      - name: Write Step 12 evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          root=Path('artifacts/staged-pattern-canary-expansion-activation-monitoring-v0.1')
          root.mkdir(parents=True,exist_ok=True)
          regression=json.loads((root/'REGRESSION_BASELINE.json').read_text())
          evidence={
            'artifact':'Staged_Pattern_Canary_Expansion_Activation_Monitoring_v0.1',
            'step':'STEP_12_STAGED_CANARY_EXPANSION_ACTIVATION_AND_MONITORING',
            'overall':{'TEST_AUTHORED':True,'TEST_EXECUTED':True,'TEST_PASS':True,'STEP_12_IMPLEMENTATION_COMPLETE':True,'ADDED_FILES':5,'MODIFIED_EXISTING_FILES':0,'DELETED_EXISTING_FILES':0,'REGRESSION_DELTA_ZERO':regression['failure_name_delta_zero']},
            'capabilities':{'EXACT_STEP11_APPROVAL_REQUIRED':True,'STEP10_AUTHORIZATION_LINEAGE_PRESERVED':True,'ROUTING_SEED_PRESERVED':True,'PREVIOUS_ROUTING_FRACTION':0.05,'STAGED_MAX_ROUTING_FRACTION':0.10,'MAX_ABS_PROBABILITY_SHIFT':0.02,'RETROACTIVE_ROUTING_FORBIDDEN':True,'POST_KICKOFF_ROUTING_FORBIDDEN':True,'EXPANSION_BAND_SEPARATELY_IDENTIFIED':True,'MIN_NEW_STAGE_ROUTED_SETTLED_N':30,'MIN_EXPANSION_BAND_ROUTED_SETTLED_N':30,'FULL_STAGE_HEALTH_REQUIRED':True,'EXPANSION_BAND_HEALTH_REQUIRED':True,'MAX_ECE_DEGRADATION':0.01,'ADDITIONAL_ALPHA_SPENT':False,'IMMEDIATE_KILL_SIGNALS_ENFORCED':True,'ROLLBACK_TO_CHAMPION_ONLY':True,'PRODUCTION_DECISION_WEIGHT':0,'AUTOMATIC_FURTHER_EXPANSION':False,'AUTOMATIC_FULL_PROMOTION':False},
            'real_evidence_status':{'REAL_STEP12_ACTIVATION_EXECUTED_IN_CI':False,'SYNTHETIC_TEST_FIXTURES_ONLY':True,'SYNTHETIC_RESULTS_COUNT_AS_REAL_STEP12_EVIDENCE':False,'REAL_STEP12_ACTIVATION_CLAIMED':False,'CURRENT_REAL_STATUS':'NOT_RUN_WAITING_FOR_REAL_STEP11_APPROVAL_AND_NEW_STAGED_EXPANSION_EVIDENCE'},
            'regression_baseline':regression,
            'governance':{'P002_UNCHANGED':True,'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,'GATE6_CAPITAL_OWNER_PRESERVED':True,'EXISTING_OWNER_REPLACEMENT':False,'AUTOMATIC_RETUNING':False,'CAPITAL_EFFECT':'NONE','REAL_MONEY':'NO'},
            'hashes':{'contract_sha256':sha('contracts/staged-pattern-canary-expansion-activation-monitoring-v0.1.json'),'runtime_sha256':sha('packages/intelligence-engine/src/staged-pattern-canary-expansion-activation-monitoring.mjs'),'test_sha256':sha('packages/intelligence-engine/tests/staged-pattern-canary-expansion-activation-monitoring.test.mjs'),'docs_sha256':sha('packages/intelligence-engine/docs/STAGED_PATTERN_CANARY_EXPANSION_ACTIVATION_MONITORING_V0_1.md'),'p002_sha256':sha('contracts/p002-frozen-rules.json'),'gate6_manifest_sha256':sha('packages/gate6/gate6_manifest.json')},
            'next_stage':'STEP_13_PATTERN_CANARY_GRADUATION_OR_RETIREMENT_GOVERNANCE'
          }
          (root/'TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: staged-pattern-canary-expansion-activation-monitoring-v0.1-evidence
          path: |
            artifacts/staged-pattern-canary-expansion-activation-monitoring-v0.1/TEST_EVIDENCE.json
            artifacts/staged-pattern-canary-expansion-activation-monitoring-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
