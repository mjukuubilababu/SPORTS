name: Pattern Promotion Governance Shadow Integration v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set

permissions:
  contents: read

jobs:
  validate-pattern-shadow-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce Step 8 introduction scope or protect Step 8 artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          owned=(
            "contracts/pattern-promotion-governance-shadow-integration-v0.1.json"
            "packages/intelligence-engine/src/pattern-promotion-shadow-integration.mjs"
            "packages/intelligence-engine/tests/pattern-promotion-shadow-integration.test.mjs"
            "packages/intelligence-engine/docs/PATTERN_PROMOTION_GOVERNANCE_SHADOW_INTEGRATION_V0_1.md"
            ".github/workflows/pattern-promotion-governance-shadow-integration-v0.1.yml"
          )
          if ! git cat-file -e "$BASE:contracts/pattern-promotion-governance-shadow-integration-v0.1.json" 2>/dev/null; then
            declare -A seen=()
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"; matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" == "A" ]] || { echo "STEP8_INTRODUCTION_FILE_MUST_BE_ADDED: $row"; exit 1; }
                  seen["$path"]=1; matched=true; break
                fi
              done
              [[ "$matched" == true ]] || { echo "STEP8_UNEXPECTED_INTRODUCTION_CHANGE: $row"; exit 1; }
            done
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP8_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP8_INTRODUCTION_FILE_SET_INCOMPLETE"; exit 1; }
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  case "$status" in D|R*) echo "STEP8_OWNED_ARTIFACT_DELETION_OR_RENAME_FORBIDDEN: $row"; exit 1 ;; esac
                fi
              done
            done
          fi
          echo "STEP8_SCOPE_GUARD=PASS"

      - name: Validate Step 7-8 contracts and ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s7=json.loads(Path('contracts/pattern-temporal-context-stability-v0.1.json').read_text())
          s8=json.loads(Path('contracts/pattern-promotion-governance-shadow-integration-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          assert s7['contract_id']=='PATTERN_TEMPORAL_CONTEXT_STABILITY_V0_1'
          assert s7['status']=='STEP_7_IMPLEMENTED'
          assert s7['next_stage']=='STEP_8_PATTERN_PROMOTION_GOVERNANCE_AND_SHADOW_INTEGRATION'
          assert s8['contract_id']=='PATTERN_PROMOTION_GOVERNANCE_SHADOW_INTEGRATION_V0_1'
          assert s8['status']=='STEP_8_IMPLEMENTED'
          assert s8['shadow_boundary']['mode']=='SHADOW_ONLY'
          assert s8['shadow_boundary']['champion_path_remains_authoritative'] is True
          assert s8['shadow_boundary']['shadow_prediction_may_reach_decision_path'] is False
          assert s8['inputs']['pattern_to_prediction_calibration']['minimum_sample_n']==30
          assert s8['inputs']['pattern_to_prediction_calibration']['bookmaker_odds_allowed_as_calibration_input'] is False
          assert s8['promotion_evidence']['minimum_settled_shadow_n']==100
          assert s8['promotion_evidence']['existing_champion_challenger_gate_reused'] is True
          assert s8['promotion_evidence']['existing_governed_learning_loop_reused'] is True
          assert s8['decision_boundary']['step8_decision_weight']==0
          assert s8['decision_boundary']['automatic_pattern_promotion'] is False
          assert s8['decision_boundary']['production_mutation_allowed'] is False
          assert s8['ownership']['existing_owners_replaced'] is False
          assert s8['real_evidence_boundary']['synthetic_unit_test_rows_may_count_as_real_shadow_evidence'] is False
          assert s8['governance']['p002_changed'] is False
          assert s8['governance']['gate1_to_gate6_ownership_changed'] is False
          assert s8['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['discovery_min_n']==30
          assert p002['independent_validation_min_n']==30
          print('STEP7_TO_STEP8_CONTRACT_CHAIN=PASS')
          print('STEP8_EXISTING_OWNERS_PRESERVED=PASS')
          print('STEP8_SHADOW_ONLY=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Run Step 7 regression
        run: node --test packages/intelligence-engine/tests/pattern-temporal-context-stability.test.mjs

      - name: Run Step 8 tests
        run: node --test packages/intelligence-engine/tests/pattern-promotion-shadow-integration.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/pattern-promotion-shadow-integration-v0.1
          rm -rf /tmp/step8-base /tmp/step8-head
          git worktree add --detach /tmp/step8-base "$BASE"
          git worktree add --detach /tmp/step8-head "$HEAD"
          set +e
          (cd /tmp/step8-base/packages/intelligence-engine && npm test) > /tmp/step8-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step8-head/packages/intelligence-engine && npm test) > /tmp/step8-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s\n' "$BASE_RC" > /tmp/step8-base.rc
          printf '%s\n' "$HEAD_RC" > /tmp/step8-head.rc
          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          def failures(path):
            out=[]
            for line in Path(path).read_text(errors='replace').splitlines():
              t=line.strip(); m=tap.match(t) or glyph.match(t)
              if m: out.append(m.group(1).strip())
            return sorted(set(out))
          brc=int(Path('/tmp/step8-base.rc').read_text()); hrc=int(Path('/tmp/step8-head.rc').read_text())
          base=failures('/tmp/step8-base.log'); head=failures('/tmp/step8-head.log')
          if brc!=0 and not base: raise SystemExit('STEP8_UNPARSED_CANONICAL_BASE_TEST_FAILURE_DEBT')
          if hrc!=0 and not head: raise SystemExit('STEP8_UNPARSED_HEAD_TEST_FAILURE_DEBT')
          if brc!=hrc: raise SystemExit('STEP8_NPM_TEST_EXIT_CODE_CHANGED')
          if base!=head: raise SystemExit('STEP8_REGRESSION_FAILURE_SET_CHANGED')
          summary={'comparison':'CANONICAL_BASE_VS_STEP8_HEAD','node_version':'20','base_npm_test_rc':brc,'head_npm_test_rc':hrc,'base_failure_n':len(base),'head_failure_n':len(head),'base_failures':base,'head_failures':head,'new_failure_names':sorted(set(head)-set(base)),'removed_failure_names':sorted(set(base)-set(head)),'failure_name_delta_zero':base==head}
          Path('artifacts/pattern-promotion-shadow-integration-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          echo "STEP8_REGRESSION_DELTA=0"

      - name: Write Step 8 evidence
        run: |
          mkdir -p artifacts/pattern-promotion-shadow-integration-v0.1
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          regression=json.loads(Path('artifacts/pattern-promotion-shadow-integration-v0.1/REGRESSION_BASELINE.json').read_text())
          evidence={
            'artifact':'Pattern_Promotion_Governance_Shadow_Integration_v0.1',
            'step':'STEP_8_PATTERN_PROMOTION_GOVERNANCE_AND_SHADOW_INTEGRATION',
            'overall':{'TEST_AUTHORED':True,'TEST_EXECUTED':True,'TEST_PASS':True,'STEP_8_IMPLEMENTATION_COMPLETE':True,'ADDED_FILES':5,'MODIFIED_EXISTING_FILES':0,'DELETED_EXISTING_FILES':0,'REGRESSION_DELTA_ZERO':regression['failure_name_delta_zero']},
            'capabilities':{'SHADOW_ONLY':True,'CHAMPION_PATH_AUTHORITATIVE':True,'PATTERN_TO_PREDICTION_CALIBRATION_REQUIRED':True,'CALIBRATION_MIN_N':30,'BOOKMAKER_CALIBRATION_INPUT_FORBIDDEN':True,'MAX_ABS_LOGIT_SHIFT':0.35,'MAX_ABS_PROBABILITY_SHIFT':0.10,'SHADOW_MIN_SETTLED_N':100,'BRIER_GATE':True,'LOGLOSS_GATE':True,'ECE_NON_DEGRADATION_GATE':True,'EXISTING_CHAMPION_CHALLENGER_REUSED':True,'EXISTING_GOVERNED_LEARNING_REUSED':True,'PREDICTIVE_WEIGHT':0,'AUTOMATIC_PROMOTION':False},
            'real_evidence_status':{'REAL_SHADOW_EVALUATION_EXECUTED_IN_CI':False,'SYNTHETIC_TEST_FIXTURES_ONLY':True,'SYNTHETIC_RESULTS_COUNT_AS_REAL_PROMOTION_EVIDENCE':False,'CURRENT_REAL_STATUS':'NOT_RUN_WAITING_FOR_REAL_STEP7_VALIDATION_CALIBRATION_AND_SHADOW_EVIDENCE'},
            'regression_baseline':regression,
            'governance':{'P002_UNCHANGED':True,'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,'EXISTING_OWNER_REPLACEMENT':False,'AUTOMATIC_RETUNING':False,'AUTOMATIC_PATTERN_PROMOTION':False,'CAPITAL_EFFECT':'NONE','REAL_MONEY':'NO'},
            'hashes':{'contract_sha256':sha('contracts/pattern-promotion-governance-shadow-integration-v0.1.json'),'runtime_sha256':sha('packages/intelligence-engine/src/pattern-promotion-shadow-integration.mjs'),'test_sha256':sha('packages/intelligence-engine/tests/pattern-promotion-shadow-integration.test.mjs'),'docs_sha256':sha('packages/intelligence-engine/docs/PATTERN_PROMOTION_GOVERNANCE_SHADOW_INTEGRATION_V0_1.md'),'p002_sha256':sha('contracts/p002-frozen-rules.json')},
            'next_stage':'STEP_9_PATTERN_SHADOW_FORWARD_MONITORING_AND_PROMOTION_APPROVAL'
          }
          Path('artifacts/pattern-promotion-shadow-integration-v0.1/TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pattern-promotion-governance-shadow-integration-v0.1-evidence
          path: |
            artifacts/pattern-promotion-shadow-integration-v0.1/TEST_EVIDENCE.json
            artifacts/pattern-promotion-shadow-integration-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
