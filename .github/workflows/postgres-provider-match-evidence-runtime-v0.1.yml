name: PostgreSQL Provider Match Evidence Runtime v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
    paths:
      - 'contracts/postgres-provider-match-evidence-runtime-v0.1.json'
      - 'packages/reference-e2e/docs/POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_V0_1.md'
      - 'packages/reference-e2e/package.json'
      - 'packages/reference-e2e/scripts/run-provider-match-evidence-persistence.mjs'
      - 'packages/reference-e2e/src/postgres-provider-match-evidence-runtime.mjs'
      - 'packages/reference-e2e/tests/postgres-provider-match-evidence-runtime.integration.mjs'
      - '.github/workflows/postgres-provider-match-evidence-runtime-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-provider-match-evidence-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d decision_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/decision_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          python - "$BASE" <<'PY'
          import subprocess, sys
          base=sys.argv[1]
          allowed={
            '.github/workflows/postgres-provider-match-evidence-runtime-v0.1.yml',
            'contracts/postgres-provider-match-evidence-runtime-v0.1.json',
            'packages/reference-e2e/docs/POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_V0_1.md',
            'packages/reference-e2e/package.json',
            'packages/reference-e2e/scripts/run-provider-match-evidence-persistence.mjs',
            'packages/reference-e2e/src/postgres-provider-match-evidence-runtime.mjs',
            'packages/reference-e2e/tests/postgres-provider-match-evidence-runtime.integration.mjs',
          }
          changed=[]
          for line in subprocess.check_output(['git','diff','--name-status',f'{base}...HEAD'],text=True).splitlines():
            parts=line.split('\t')
            status=parts[0]
            paths=parts[1:]
            if status.startswith(('D','R')):
              raise SystemExit(f'POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_DESTRUCTIVE_CHANGE_FORBIDDEN: {line}')
            changed.extend(paths)
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
            raise SystemExit(f'POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_SCOPE_VIOLATION: {unexpected}')
          print(f'POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_SCOPE=PASS files={sorted(set(changed))}')
          PY

      - name: Validate runtime contract and frozen governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path('contracts/postgres-provider-match-evidence-runtime-v0.1.json').read_text())
          base=json.loads(Path('contracts/postgres-provider-match-evidence-persistence-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          assert runtime['contract']=='postgres-provider-match-evidence-runtime'
          assert runtime['status']=='IMPLEMENTED'
          assert runtime['extends']=='postgres-provider-match-evidence-persistence-v0.1'
          assert runtime['persistence']['new_tables']==0
          assert runtime['persistence']['all_unique_events_one_transaction'] is True
          assert runtime['persistence']['partial_failure_full_rollback'] is True
          assert runtime['persistence']['one_dedicated_pool_client'] is True
          assert runtime['runtime_boundaries']['strict_batch'] is True
          assert runtime['runtime_boundaries']['any_rejected_event_blocks_all_writes'] is True
          assert runtime['readback_attestation']['complete_exact_feature_set_required'] is True
          assert runtime['readback_attestation']['provider_payload_fingerprint_recomputed'] is False
          assert runtime['readback_attestation']['raw_evidence_returned'] is False
          assert runtime['database']['ci_major_version']==16
          assert runtime['database']['migration_added'] is False
          assert runtime['governance']['p002_changed'] is False
          assert runtime['governance']['authoritative_truth_owner']=='GATE1'
          assert runtime['governance']['capital_authority']=='GATE6'
          assert runtime['governance']['capital_state']=='LOCKED'
          assert runtime['governance']['real_money']=='NO'
          assert base['database']['new_parallel_tables']==0
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          print('POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_CONTRACT=PASS')
          print('P002_UNCHANGED=PASS')
          print('GATE1_GATE6_OWNERSHIP_UNCHANGED=PASS')
          PY

      - name: Confirm PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_isready -h localhost -p 5432 -U postgres -d decision_test

      - name: Apply existing canonical persistence chain
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0002_reference_evidence_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0003_reference_stage_checkpoints_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0004_reference_run_leases_fencing_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0005_ingestion_provenance_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0006_feature_model_frozen_signal_lineage_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0007_feature_model_signal_lineage_review_fixes_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0009_downstream_lineage_attestation_feature_payload_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0010_provider_match_evidence_persistence_v0_1.sql
          echo 'POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_SCHEMA=PASS'

      - name: Install reference E2E dependencies
        working-directory: packages/reference-e2e
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Preserve reference behavior
        working-directory: packages/reference-e2e
        env:
          REFERENCE_EVIDENCE_PERSISTENCE_MODE: disabled
        run: |
          npm test
          npm run e2e

      - name: Run canonical provider regressions
        run: |
          node --test \
            packages/intelligence-engine/tests/match-evidence-analysis.test.mjs \
            packages/intelligence-engine/tests/real-provider-match-evidence-ingestion.test.mjs

      - name: Run existing and operational PostgreSQL regressions
        working-directory: packages/reference-e2e
        run: |
          node --test \
            tests/postgres-provider-match-evidence-persistence.integration.mjs \
            tests/postgres-provider-match-evidence-runtime.integration.mjs

      - name: Verify durable operational boundaries
        run: |
          set -euo pipefail
          observation_count="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE event_id LIKE 'RUNTIME-EVENT-%'")"
          feature_count="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_feature_provenance_lineage_v01 WHERE event_id LIKE 'RUNTIME-EVENT-%'")"
          test "$observation_count" -ge 4
          test "$feature_count" -ge 80
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE event_id LIKE 'RUNTIME-EVENT-ROLLBACK-%'")" = "0"
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_feature_provenance_lineage_v01 WHERE event_id LIKE 'RUNTIME-EVENT-ROLLBACK-%'")" = "0"
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE event_id LIKE 'RUNTIME-EVENT-%' AND (capital_state<>'LOCKED' OR real_money<>'NO')")" = "0"
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE event_id LIKE 'RUNTIME-EVENT-%' AND evidence_kind IN ('SETTLEMENT','PREDICTION_SETTLEMENT')")" = "0"
          echo "POSTGRES_PROVIDER_MATCH_EVIDENCE_RUNTIME_DB=PASS observations=$observation_count features=$feature_count"

      - name: Write verification artifact
        run: |
          mkdir -p artifacts/postgres-provider-match-evidence-runtime
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          url='postgresql://postgres:postgres@localhost:5432/decision_test'
          def scalar(sql):
            return subprocess.check_output(['psql',url,'-qAt','-c',sql],text=True).strip()
          report={
            'version':'v0.1',
            'decision':'PASS',
            'database':'PostgreSQL 16 ephemeral CI',
            'new_tables':0,
            'runtime_observations':int(scalar("SELECT count(*) FROM reference_ingestion_observations_v01 WHERE event_id LIKE 'RUNTIME-EVENT-%'")),
            'runtime_features':int(scalar("SELECT count(*) FROM reference_feature_provenance_lineage_v01 WHERE event_id LIKE 'RUNTIME-EVENT-%'")),
            'strict_batch_rejection_verified':True,
            'one_batch_transaction_verified':True,
            'partial_failure_full_rollback_verified':True,
            'one_dedicated_pool_client_verified':True,
            'exact_replay_idempotent':True,
            'changed_payload_same_identity_rejected':True,
            'durable_readback_archived_fingerprints_recomputed':True,
            'provider_payload_fingerprint_recomputed':False,
            'complete_feature_set_attested':True,
            'operational_cli_verified':True,
            'raw_payload_or_snapshot_returned':False,
            'settlement_separate':True,
            'p002_changed':False,
            'gate1_truth_owner_changed':False,
            'gate6_capital_owner_changed':False,
            'capital_state':'LOCKED',
            'real_money':'NO'
          }
          assert report['runtime_observations'] >= 4
          assert report['runtime_features'] >= 80
          Path('artifacts/postgres-provider-match-evidence-runtime/verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload PostgreSQL runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-provider-match-evidence-runtime-v0.1
          path: |
            artifacts/postgres-provider-match-evidence-runtime/verification.json
            contracts/postgres-provider-match-evidence-runtime-v0.1.json
          if-no-files-found: error
