name: Pattern Intelligence Contract v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pattern-intelligence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Protect Step 0 owned artifacts
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          base_ref = os.environ['BASE_REF']
          raw = subprocess.check_output(
              ['git', 'diff', '--name-status', f'origin/{base_ref}...HEAD'],
              text=True,
          ).strip().splitlines()

          owned = {
              'contracts/pattern-intelligence-contract-v0.1.json',
              'packages/intelligence-engine/docs/PATTERN_INTELLIGENCE_CONTRACT_V0_1.md',
              'scripts/test_pattern_intelligence_contract_v0_1.py',
              '.github/workflows/pattern-intelligence-contract-v0.1.yml',
          }
          touched = []
          for line in raw:
              parts = line.split('\t')
              status = parts[0] if parts else ''
              paths = parts[1:]
              owned_paths = [path for path in paths if path in owned]
              if not owned_paths:
                  continue
              touched.extend(owned_paths)
              if status.startswith('D'):
                  raise SystemExit(f'STEP0_OWNED_ARTIFACT_DELETE_FORBIDDEN: {line}')
              if status.startswith('R'):
                  raise SystemExit(f'STEP0_OWNED_ARTIFACT_RENAME_FORBIDDEN: {line}')

          print(f'STEP0_OWNED_ARTIFACTS_TOUCHED={sorted(set(touched))}')
          print('STEP0_FORWARD_COMPATIBILITY_GUARD=PASS')
          PY

      - name: Validate Pattern Intelligence Contract
        run: python scripts/test_pattern_intelligence_contract_v0_1.py

      - name: Write test evidence
        run: |
          mkdir -p artifacts/pattern-intelligence-contract-v0.1
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          contract = root / 'contracts/pattern-intelligence-contract-v0.1.json'
          p002 = root / 'contracts/p002-frozen-rules.json'
          evidence = {
              'artifact': 'Pattern_Intelligence_Contract_v0.1',
              'step': 0,
              'state': 'ARCHITECTURE_FROZEN_SPEC_ONLY',
              'git_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'contract_sha256': hashlib.sha256(contract.read_bytes()).hexdigest(),
              'p002_sha256': hashlib.sha256(p002.read_bytes()).hexdigest(),
              'checks': {
                  'CONTRACT_VALID': True,
                  'STEP0_OWNED_ARTIFACTS_PRESENT': True,
                  'STEP0_DESTRUCTIVE_CHANGE': False,
                  'FORWARD_COMPATIBILITY_GUARD': True,
                  'EXISTING_ARTIFACTS_DELETED': 0,
                  'EXISTING_CANONICAL_OWNERS_REPLACED': 0,
                  'P002_UNCHANGED': True,
                  'RUNTIME_PATTERN_MINER_IMPLEMENTED': False,
                  'NEXT_STAGE': 'STEP_1_CANONICAL_MATCH_MEMORY'
              },
              'governance': {
                  'real_money': 'NO',
                  'automatic_retuning': False,
                  'automatic_pattern_promotion': False,
                  'destructive_change_requires_explicit_user_decision': True
              }
          }
          out = root / 'artifacts/pattern-intelligence-contract-v0.1/TEST_EVIDENCE.json'
          out.write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print(out.read_text())
          PY

      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: pattern-intelligence-contract-v0.1-evidence
          path: artifacts/pattern-intelligence-contract-v0.1/TEST_EVIDENCE.json
          if-no-files-found: error
