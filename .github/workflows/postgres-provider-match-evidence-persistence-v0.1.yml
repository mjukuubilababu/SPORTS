name: PostgreSQL Provider Match Evidence Persistence v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
    paths:
      - 'packages/reference-e2e/migrations/0010_provider_match_evidence_persistence_v0_1.sql'
      - 'packages/reference-e2e/src/postgres-provider-match-evidence-persistence.mjs'
      - 'packages/reference-e2e/tests/postgres-provider-match-evidence-persistence.integration.mjs'
      - 'packages/reference-e2e/docs/POSTGRES_PROVIDER_MATCH_EVIDENCE_PERSISTENCE_V0_1.md'
      - 'contracts/postgres-provider-match-evidence-persistence-v0.1.json'
      - '.github/workflows/postgres-provider-match-evidence-persistence-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-provider-match-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d decision_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/decision_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          python - "$BASE" <<'PY'
          import subprocess, sys
          base=sys.argv[1]
          allowed={
            '.github/workflows/postgres-provider-match-evidence-persistence-v0.1.yml',
            'contracts/postgres-provider-match-evidence-persistence-v0.1.json',
            'packages/reference-e2e/docs/POSTGRES_PROVIDER_MATCH_EVIDENCE_PERSISTENCE_V0_1.md',
            'packages/reference-e2e/migrations/0010_provider_match_evidence_persistence_v0_1.sql',
            'packages/reference-e2e/src/postgres-provider-match-evidence-persistence.mjs',
            'packages/reference-e2e/tests/postgres-provider-match-evidence-persistence.integration.mjs',
          }
          changed=[]
          for line in subprocess.check_output(['git','diff','--name-status',f'{base}...HEAD'],text=True).splitlines():
            parts=line.split('\t')
            status=parts[0]
            paths=parts[1:]
            if status.startswith(('D','R')):
              raise SystemExit(f'POSTGRES_PROVIDER_MATCH_EVIDENCE_DESTRUCTIVE_CHANGE_FORBIDDEN: {line}')
            changed.extend(paths)
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
            raise SystemExit(f'POSTGRES_PROVIDER_MATCH_EVIDENCE_SCOPE_VIOLATION: {unexpected}')
          print(f'POSTGRES_PROVIDER_MATCH_EVIDENCE_SCOPE=PASS files={sorted(set(changed))}')
          PY

      - name: Validate contracts and frozen governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('contracts/postgres-provider-match-evidence-persistence-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          assert c['contract']=='postgres-provider-match-evidence-persistence'
          assert c['version']=='v0.1'
          assert c['status']=='IMPLEMENTED'
          assert c['owner']['parallel_match_evidence_store'] is False
          assert c['owner']['authoritative_truth_owner']=='GATE1'
          assert c['persistence']['pg_pool_uses_one_dedicated_pool_client'] is True
          assert c['persistence']['exact_replay_idempotent'] is True
          assert c['persistence']['changed_payload_same_identity_rejected'] is True
          assert c['lineage']['event_aware_foreign_key'] is True
          assert c['lineage']['unverified_or_late_feature_cannot_feed_model'] is True
          assert c['time_and_truth_boundaries']['settlement_separate'] is True
          assert c['database']['ci_major_version']==16
          assert c['database']['new_parallel_tables']==0
          assert c['governance']['p002_changed'] is False
          assert c['governance']['gate1_to_gate6_ownership_changed'] is False
          assert c['governance']['capital_authority']=='GATE6'
          assert c['governance']['capital_state']=='LOCKED'
          assert c['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          print('POSTGRES_PROVIDER_MATCH_EVIDENCE_CONTRACT=PASS')
          print('P002_UNCHANGED=PASS')
          print('GATE1_GATE6_OWNERSHIP_UNCHANGED=PASS')
          PY

      - name: Confirm PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_isready -h localhost -p 5432 -U postgres -d decision_test

      - name: Apply existing lineage chain and match evidence guards
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0002_reference_evidence_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0003_reference_stage_checkpoints_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0004_reference_run_leases_fencing_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0005_ingestion_provenance_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0006_feature_model_frozen_signal_lineage_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0007_feature_model_signal_lineage_review_fixes_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0009_downstream_lineage_attestation_feature_payload_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0010_provider_match_evidence_persistence_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0010_provider_match_evidence_persistence_v0_1.sql
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM pg_trigger WHERE tgname IN ('reference_match_evidence_snapshot_observation_guard_v01','reference_match_evidence_feature_lineage_guard_v01') AND NOT tgisinternal")" = "2"
          echo 'POSTGRES_PROVIDER_MATCH_EVIDENCE_MIGRATION_IDEMPOTENT=PASS'

      - name: Install reference E2E dependencies
        working-directory: packages/reference-e2e
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Preserve reference behavior
        working-directory: packages/reference-e2e
        env:
          REFERENCE_EVIDENCE_PERSISTENCE_MODE: disabled
        run: |
          npm test
          npm run e2e

      - name: Run canonical provider and snapshot regressions
        run: |
          node --test             packages/intelligence-engine/tests/match-evidence-analysis.test.mjs             packages/intelligence-engine/tests/real-provider-match-evidence-ingestion.test.mjs

      - name: Run PostgreSQL provenance and lineage regressions
        working-directory: packages/reference-e2e
        run: |
          node --test             tests/postgres-ingestion-provenance.integration.mjs             tests/postgres-feature-model-signal-lineage.integration.mjs             tests/postgres-provider-match-evidence-persistence.integration.mjs

      - name: Verify durable database boundaries
        run: |
          set -euo pipefail
          observation_count="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE evidence_kind='MATCH_EVIDENCE_SNAPSHOT'")"
          feature_count="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_feature_provenance_lineage_v01 WHERE feature_name LIKE 'match_evidence.%'")"
          model_count="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_model_snapshots_v01 WHERE model_snapshot_id LIKE 'MODEL-MATCH-EVIDENCE-%'")"
          signal_count="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_frozen_signal_snapshots_v01 WHERE signal_snapshot_id LIKE 'SIGNAL-MATCH-EVIDENCE-%'")"
          test "$observation_count" -ge 6
          test "$feature_count" -ge 20
          test "$model_count" -ge 1
          test "$signal_count" -ge 1
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE evidence_kind='MATCH_EVIDENCE_SNAPSHOT' AND (payload_json->'snapshot'->>'event_id' IS DISTINCT FROM event_id OR payload_json->'snapshot'->>'evidence_snapshot_id' IS DISTINCT FROM entity_id)")" = "0"
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_ingestion_observations_v01 WHERE evidence_kind IN ('SETTLEMENT','PREDICTION_SETTLEMENT')")" = "0"
          echo 'POSTGRES_PROVIDER_MATCH_EVIDENCE_DB_BOUNDARIES=PASS'

      - name: Write verification artifact
        run: |
          mkdir -p artifacts/postgres-provider-match-evidence
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          url='postgresql://postgres:postgres@localhost:5432/decision_test'
          def scalar(sql):
            return subprocess.check_output(['psql',url,'-qAt','-c',sql],text=True).strip()
          report={
            'version':'v0.1',
            'decision':'PASS',
            'database':'PostgreSQL 16 ephemeral CI',
            'parallel_tables_created':0,
            'match_evidence_observations':int(scalar("SELECT count(*) FROM reference_ingestion_observations_v01 WHERE evidence_kind='MATCH_EVIDENCE_SNAPSHOT'")),
            'match_evidence_features':int(scalar("SELECT count(*) FROM reference_feature_provenance_lineage_v01 WHERE feature_name LIKE 'match_evidence.%'")),
            'exact_snapshot_and_provider_fingerprints_archived':True,
            'every_feature_exact_source_lineage_verified':True,
            'exact_replay_idempotent':True,
            'changed_payload_same_identity_rejected':True,
            'cross_event_application_and_db_rejected':True,
            'post_kickoff_db_guard_verified':True,
            'partial_failure_full_rollback_verified':True,
            'one_dedicated_pool_client_verified':True,
            'immutable_update_delete_verified':True,
            'existing_model_and_frozen_signal_path_verified':True,
            'unverified_evidence_model_block_verified':True,
            'settlement_separate':True,
            'p002_changed':False,
            'gate1_truth_owner_changed':False,
            'gate6_capital_owner_changed':False,
            'capital_state':'LOCKED',
            'real_money':'NO'
          }
          assert report['match_evidence_observations'] >= 6
          assert report['match_evidence_features'] >= 20
          Path('artifacts/postgres-provider-match-evidence/verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload PostgreSQL match evidence evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-provider-match-evidence-persistence-v0.1
          path: |
            artifacts/postgres-provider-match-evidence/verification.json
            contracts/postgres-provider-match-evidence-persistence-v0.1.json
          if-no-files-found: error
