name: Pattern Shadow Forward Monitoring Promotion Approval v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set

permissions:
  contents: read

jobs:
  validate-pattern-forward-monitoring:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce Step 9 introduction scope or protect Step 9 artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          owned=(
            "contracts/pattern-shadow-forward-monitoring-promotion-approval-v0.1.json"
            "packages/intelligence-engine/src/pattern-shadow-forward-monitoring-promotion-approval.mjs"
            "packages/intelligence-engine/tests/pattern-shadow-forward-monitoring-promotion-approval.test.mjs"
            "packages/intelligence-engine/docs/PATTERN_SHADOW_FORWARD_MONITORING_PROMOTION_APPROVAL_V0_1.md"
            ".github/workflows/pattern-shadow-forward-monitoring-promotion-approval-v0.1.yml"
          )
          if ! git cat-file -e "$BASE:contracts/pattern-shadow-forward-monitoring-promotion-approval-v0.1.json" 2>/dev/null; then
            declare -A seen=()
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"; matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" == "A" ]] || { echo "STEP9_INTRODUCTION_FILE_MUST_BE_ADDED: $row"; exit 1; }
                  seen["$path"]=1; matched=true; break
                fi
              done
              [[ "$matched" == true ]] || { echo "STEP9_UNEXPECTED_INTRODUCTION_CHANGE: $row"; exit 1; }
            done
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP9_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP9_INTRODUCTION_FILE_SET_INCOMPLETE"; exit 1; }
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  case "$status" in D|R*) echo "STEP9_OWNED_ARTIFACT_DELETION_OR_RENAME_FORBIDDEN: $row"; exit 1 ;; esac
                fi
              done
            done
          fi
          echo "STEP9_SCOPE_GUARD=PASS"

      - name: Validate Step 8-9 contracts and frozen governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s8=json.loads(Path('contracts/pattern-promotion-governance-shadow-integration-v0.1.json').read_text())
          s9=json.loads(Path('contracts/pattern-shadow-forward-monitoring-promotion-approval-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          assert s8['contract_id']=='PATTERN_PROMOTION_GOVERNANCE_SHADOW_INTEGRATION_V0_1'
          assert s8['status']=='STEP_8_IMPLEMENTED'
          assert s8['next_stage']=='STEP_9_PATTERN_SHADOW_FORWARD_MONITORING_AND_PROMOTION_APPROVAL'
          assert s9['contract_id']=='PATTERN_SHADOW_FORWARD_MONITORING_PROMOTION_APPROVAL_V0_1'
          assert s9['status']=='STEP_9_IMPLEMENTED'
          assert s9['inputs']['required_step8_state']=='ELIGIBLE_FOR_MANUAL_GOVERNANCE_REVIEW_ZERO_WEIGHT'
          assert s9['forward_monitoring']['step8_rows_may_be_reused'] is False
          assert s9['forward_monitoring']['minimum_new_forward_settled_n']==30
          assert s9['forward_monitoring']['minimum_new_forward_settled_n_basis']=='P002_INDEPENDENT_VALIDATION_MIN_N'
          assert s9['forward_monitoring']['additional_alpha_spent'] is False
          assert s9['approval']['automatic_approval'] is False
          assert s9['approval']['approval_is_not_activation'] is True
          assert s9['approval']['step9_decision_weight']==0
          assert s9['approval']['production_mutation_allowed'] is False
          assert s9['rollback_policy_for_next_stage']['pre_registered'] is True
          assert s9['ownership']['existing_owners_replaced'] is False
          assert s9['real_evidence_boundary']['synthetic_unit_test_rows_may_count_as_real_forward_evidence'] is False
          assert s9['governance']['p002_changed'] is False
          assert s9['governance']['gate1_to_gate6_ownership_changed'] is False
          assert s9['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['independent_validation_min_n']==30
          assert p002['capital_effect']=='NONE_UNTIL_GOVERNED_EVIDENCE'
          print('STEP8_TO_STEP9_CONTRACT_CHAIN=PASS')
          print('STEP9_NEW_FORWARD_COHORT_REQUIRED=PASS')
          print('STEP9_APPROVAL_IS_NOT_ACTIVATION=PASS')
          print('STEP9_ROLLBACK_POLICY_PREREGISTERED=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Run Step 8 regression
        run: node --test packages/intelligence-engine/tests/pattern-promotion-shadow-integration.test.mjs

      - name: Run Step 9 tests
        run: node --test packages/intelligence-engine/tests/pattern-shadow-forward-monitoring-promotion-approval.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/pattern-shadow-forward-monitoring-promotion-approval-v0.1
          rm -rf /tmp/step9-base /tmp/step9-head
          git worktree add --detach /tmp/step9-base "$BASE"
          git worktree add --detach /tmp/step9-head "$HEAD"
          set +e
          (cd /tmp/step9-base/packages/intelligence-engine && npm test) > /tmp/step9-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step9-head/packages/intelligence-engine && npm test) > /tmp/step9-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s\n' "$BASE_RC" > /tmp/step9-base.rc
          printf '%s\n' "$HEAD_RC" > /tmp/step9-head.rc
          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          def failures(path):
            out=[]
            for line in Path(path).read_text(errors='replace').splitlines():
              t=line.strip(); m=tap.match(t) or glyph.match(t)
              if m: out.append(m.group(1).strip())
            return sorted(set(out))
          brc=int(Path('/tmp/step9-base.rc').read_text()); hrc=int(Path('/tmp/step9-head.rc').read_text())
          base=failures('/tmp/step9-base.log'); head=failures('/tmp/step9-head.log')
          if brc!=0 and not base: raise SystemExit('STEP9_UNPARSED_CANONICAL_BASE_TEST_FAILURE_DEBT')
          if hrc!=0 and not head: raise SystemExit('STEP9_UNPARSED_HEAD_TEST_FAILURE_DEBT')
          if brc!=hrc: raise SystemExit('STEP9_NPM_TEST_EXIT_CODE_CHANGED')
          if base!=head: raise SystemExit('STEP9_REGRESSION_FAILURE_SET_CHANGED')
          summary={'comparison':'CANONICAL_BASE_VS_STEP9_HEAD','node_version':'20','base_npm_test_rc':brc,'head_npm_test_rc':hrc,'base_failure_n':len(base),'head_failure_n':len(head),'base_failures':base,'head_failures':head,'new_failure_names':sorted(set(head)-set(base)),'removed_failure_names':sorted(set(base)-set(head)),'failure_name_delta_zero':base==head}
          Path('artifacts/pattern-shadow-forward-monitoring-promotion-approval-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          echo "STEP9_REGRESSION_DELTA=0"

      - name: Write Step 9 evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          root=Path('artifacts/pattern-shadow-forward-monitoring-promotion-approval-v0.1')
          root.mkdir(parents=True,exist_ok=True)
          regression=json.loads((root/'REGRESSION_BASELINE.json').read_text())
          evidence={
            'artifact':'Pattern_Shadow_Forward_Monitoring_Promotion_Approval_v0.1',
            'step':'STEP_9_PATTERN_SHADOW_FORWARD_MONITORING_AND_PROMOTION_APPROVAL',
            'overall':{'TEST_AUTHORED':True,'TEST_EXECUTED':True,'TEST_PASS':True,'STEP_9_IMPLEMENTATION_COMPLETE':True,'ADDED_FILES':5,'MODIFIED_EXISTING_FILES':0,'DELETED_EXISTING_FILES':0,'REGRESSION_DELTA_ZERO':regression['failure_name_delta_zero']},
            'capabilities':{'EXACT_STEP8_COHORT_FREEZE':True,'STEP8_ROW_REUSE_FORBIDDEN':True,'POST_DOSSIER_FORWARD_ONLY':True,'FORWARD_MIN_SETTLED_N':30,'BRIER_GATE':True,'LOGLOSS_GATE':True,'ECE_NON_DEGRADATION_GATE':True,'VERIFIED_MARKET_CLV_GATE':True,'CHRONOLOGICAL_HALF_NON_DEGRADATION':True,'ADDITIONAL_ALPHA_SPENT':False,'EXPLICIT_APPROVER_REQUIRED':True,'APPROVAL_IS_NOT_ACTIVATION':True,'ROLLBACK_POLICY_PREREGISTERED':True,'PREDICTIVE_WEIGHT':0,'AUTOMATIC_PROMOTION':False},
            'real_evidence_status':{'REAL_FORWARD_MONITORING_EXECUTED_IN_CI':False,'SYNTHETIC_TEST_FIXTURES_ONLY':True,'SYNTHETIC_RESULTS_COUNT_AS_REAL_FORWARD_EVIDENCE':False,'REAL_CANARY_APPROVAL_CLAIMED':False,'CURRENT_REAL_STATUS':'NOT_RUN_WAITING_FOR_REAL_STEP8_ELIGIBILITY_AND_NEW_FORWARD_SHADOW_EVIDENCE'},
            'regression_baseline':regression,
            'governance':{'P002_UNCHANGED':True,'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,'EXISTING_OWNER_REPLACEMENT':False,'AUTOMATIC_RETUNING':False,'AUTOMATIC_PATTERN_PROMOTION':False,'CAPITAL_EFFECT':'NONE','REAL_MONEY':'NO'},
            'hashes':{'contract_sha256':sha('contracts/pattern-shadow-forward-monitoring-promotion-approval-v0.1.json'),'runtime_sha256':sha('packages/intelligence-engine/src/pattern-shadow-forward-monitoring-promotion-approval.mjs'),'test_sha256':sha('packages/intelligence-engine/tests/pattern-shadow-forward-monitoring-promotion-approval.test.mjs'),'docs_sha256':sha('packages/intelligence-engine/docs/PATTERN_SHADOW_FORWARD_MONITORING_PROMOTION_APPROVAL_V0_1.md'),'p002_sha256':sha('contracts/p002-frozen-rules.json')},
            'next_stage':'STEP_10_CONTROLLED_PATTERN_CANARY_ACTIVATION_AND_ROLLBACK_ENFORCEMENT'
          }
          (root/'TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pattern-shadow-forward-monitoring-promotion-approval-v0.1-evidence
          path: |
            artifacts/pattern-shadow-forward-monitoring-promotion-approval-v0.1/TEST_EVIDENCE.json
            artifacts/pattern-shadow-forward-monitoring-promotion-approval-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
