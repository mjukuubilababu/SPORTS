name: Real Provider Match Evidence Ingestion v0.1
on:
  pull_request:
    branches: [import/decision-intelligence-v0.5-qualified-set]
    paths:
      - 'contracts/real-provider-match-evidence-ingestion-v0.1.json'
      - 'packages/intelligence-engine/src/real-provider-match-evidence-ingestion.mjs'
      - 'packages/intelligence-engine/src/index.mjs'
      - 'packages/intelligence-engine/tests/real-provider-match-evidence-ingestion.test.mjs'
      - 'packages/intelligence-engine/docs/REAL_PROVIDER_MATCH_EVIDENCE_INGESTION_V0_1.md'
      - '.github/workflows/real-provider-match-evidence-ingestion-v0.1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-provider-match-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run provider evidence ingestion specification tests
        working-directory: packages/intelligence-engine
        run: node --test tests/real-provider-match-evidence-ingestion.test.mjs
      - name: Compare full intelligence-engine regression with canonical base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(python -c "import json,os; print(json.load(open(os.environ['GITHUB_EVENT_PATH']))['pull_request']['base']['sha'])")
          HEAD=$(python -c "import json,os; print(json.load(open(os.environ['GITHUB_EVENT_PATH']))['pull_request']['head']['sha'])")
          rm -rf /tmp/provider-evidence-base /tmp/provider-evidence-head
          git worktree add --detach /tmp/provider-evidence-base "$BASE"
          git worktree add --detach /tmp/provider-evidence-head "$HEAD"
          set +e
          (cd /tmp/provider-evidence-base/packages/intelligence-engine && npm test) > /tmp/provider-evidence-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/provider-evidence-head/packages/intelligence-engine && npm test) > /tmp/provider-evidence-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s' "$BASE_RC" > /tmp/provider-evidence-base.rc
          printf '%s' "$HEAD_RC" > /tmp/provider-evidence-head.rc
          python - <<'PY'
          import re
          from pathlib import Path
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          def failures(path):
              out=set()
              for line in Path(path).read_text(errors='replace').splitlines():
                  m=tap.match(line.strip()) or glyph.match(line.strip())
                  if m: out.add(m.group(1).strip())
              return sorted(out)
          base_rc=int(Path('/tmp/provider-evidence-base.rc').read_text())
          head_rc=int(Path('/tmp/provider-evidence-head.rc').read_text())
          base=failures('/tmp/provider-evidence-base.log')
          head=failures('/tmp/provider-evidence-head.log')
          if base_rc and not base: raise SystemExit('UNPARSED_CANONICAL_FAILURE')
          if head_rc and not head: raise SystemExit('UNPARSED_HEAD_FAILURE')
          if base_rc != head_rc: raise SystemExit(f'REGRESSION_EXIT_CODE_CHANGED base={base_rc} head={head_rc}')
          if base != head: raise SystemExit(f'REGRESSION_FAILURE_SET_CHANGED base={base} head={head}')
          print({'canonical_baseline_rc':base_rc,'head_rc':head_rc,'failure_names':head,'new_failure_delta':0})
          PY
      - name: Revalidate frozen Pattern Intelligence and P002 contracts
        run: python scripts/test_pattern_intelligence_contract_v0_1.py
      - name: Verify governance markers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('contracts/real-provider-match-evidence-ingestion-v0.1.json').read_text())
          source=Path('packages/intelligence-engine/src/real-provider-match-evidence-ingestion.mjs').read_text()
          assert contract['status']=='IMPLEMENTED-ARTIFACT'
          assert contract['architecture']['new_evidence_store'] is False
          assert contract['architecture']['canonical_snapshot_builder_reused'] is True
          assert contract['governance']['p002_unchanged'] is True
          assert contract['governance']['gate1_truth_owner_unchanged'] is True
          assert contract['governance']['gate6_capital_owner_unchanged'] is True
          assert contract['governance']['prediction_not_validation_not_execution'] is True
          assert contract['governance']['capital']=='LOCKED'
          assert contract['governance']['real_money']=='NO'
          assert contract['governance']['automatic_promotion_or_retuning'] is False
          assert 'buildMatchEvidenceSnapshot' in source
          assert 'MARKET_DERIVED_MODEL_INPUT_FORBIDDEN' in source
          assert 'PROVIDER_EVIDENCE_IDENTITY_PAYLOAD_CONFLICT' in source
          print('REAL_PROVIDER_MATCH_EVIDENCE_GOVERNANCE=PASS')
          PY
