name: M015 First Real Forward Target

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-first-real-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify first real target registration
        run: python scripts/test_m015_first_real_target_registration.py

      - name: Verify target-capture unit tests
        run: python scripts/test_m015_forward_target_capture.py

      - name: Verify canonical forward ledger lifecycle
        run: python scripts/run_m015_forward_evidence_ledger.py

      - name: Verify first target lifecycle identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('packages/gate4/data/m015-first-real-forward-target-candidate-v0.1.json').read_text())
          l=json.loads(Path('packages/gate4/data/m015-forward-evidence-ledger-v0.1.json').read_text())
          assert len(l['entries']) == 1
          e=l['entries'][0]
          assert e['match_id'] == c['match_id']
          assert e['candidate_fingerprint_sha256'] == c['candidate_fingerprint_sha256']
          assert e['model_probability'] == c['model_probability']
          assert e['feature_snapshot_id'] == c['feature_snapshot_id']
          assert e['training_state_fingerprint'] == c['training_state_fingerprint']
          if e['state'] == 'SIGNAL_FROZEN':
              assert e['governance']['settlement_pending'] is True
              assert l['summary']['frozen_pending_settlement'] == 1
              assert l['summary']['settled_independent_n'] == 0
              print('M015_FIRST_REAL_TARGET_FROZEN_STATE=PASS')
          elif e['state'] == 'SETTLED':
              assert e['result_verified'] is True
              assert e['final_score'] == {'home': 2, 'away': 2}
              assert e['total_goals'] == 4
              assert e['outcome_u35'] == 0
              assert e['governance']['settlement_pending'] is False
              assert l['summary']['frozen_pending_settlement'] == 0
              assert l['summary']['settled_independent_n'] == 1
              print('M015_FIRST_REAL_TARGET_SETTLED_STATE=PASS')
          else:
              raise AssertionError(f"Unexpected lifecycle state: {e['state']}")
          PY

      - name: Upload target evidence
        uses: actions/upload-artifact@v4
        with:
          name: m015-first-real-forward-target
          path: |
            packages/gate4/data/m015-first-real-forward-target-candidate-v0.1.json
            packages/gate4/data/m015-first-real-forward-target-market-snapshot-v0.1.json
            packages/gate4/data/m015-forward-evidence-ledger-v0.1.json
            artifacts/m015-forward-evidence-ledger-report-v0.1.json
            artifacts/m015-forward-ledger/TEST_EVIDENCE.json
          if-no-files-found: error
