name: Real Historical Research

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run historical pipeline unit tests
        run: |
          python scripts/test_canonical_historical_pipeline.py
          python scripts/test_cross_source_result_reconciler.py
          python scripts/test_historical_closing_market_join.py
          python scripts/test_gate2_gate3_settled_corpus.py
          python scripts/test_footiqo_fixture_reconciler.py
          python scripts/test_gate3_gate4_real_robustness.py
          python scripts/test_evaluation_freeze_challenger_protocol.py
          python scripts/test_m011r_bayesian_calibrator.py
          python scripts/test_m013_negative_binomial.py
          python scripts/test_m014_hierarchical_attack_defence.py

      - name: Run real historical research runtime
        run: python scripts/run_real_2026_historical_research.py --bootstrap-reps 2000

      - name: Run M011R real walk-forward challenger
        run: python scripts/run_m011r_walkforward.py

      - name: Run M013 negative-binomial walk-forward diagnostic
        run: python scripts/run_m013_walkforward.py

      - name: Run M014 hierarchical attack-defence walk-forward diagnostic
        run: python scripts/run_m014_walkforward.py

      - name: Run Gate4 real robustness adapter
        run: |
          python packages/gate4/run_canonical_robustness.py \
            artifacts/real-2026-historical-research-report.json \
            artifacts/real-gate4-robustness-report.json

      - name: Print empirical headline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g3=json.loads(Path('artifacts/real-2026-historical-research-report.json').read_text())
          g4=json.loads(Path('artifacts/real-gate4-robustness-report.json').read_text())
          m011r=json.loads(Path('artifacts/m011r-walkforward-report-v0.1.json').read_text())
          e011r=json.loads(Path('artifacts/m011r/TEST_EVIDENCE.json').read_text())
          m013=json.loads(Path('artifacts/m013-walkforward-report-v0.1.json').read_text())
          e013=json.loads(Path('artifacts/m013/TEST_EVIDENCE.json').read_text())
          m014=json.loads(Path('artifacts/m014-walkforward-report-v0.1.json').read_text())
          e014=json.loads(Path('artifacts/m014/TEST_EVIDENCE.json').read_text())
          print('GATE3')
          print(json.dumps(g3['headline'], indent=2))
          print('M011R')
          print(json.dumps({
              'gate_results':m011r['gate_results'],
              'model_state':m011r['model_state'],
              'decision_weight':m011r['decision_weight'],
              'summary':m011r['walk_forward']['summary'],
              'metrics':m011r['walk_forward']['metrics'],
              'test_pass':e011r['overall']['TEST_PASS'],
          }, indent=2))
          print('M013')
          print(json.dumps({
              'gate_results':m013['gate_results'],
              'model_state':m013['model_state'],
              'decision_weight':m013['decision_weight'],
              'evaluation_classification':m013['walk_forward']['evaluation_classification'],
              'summary':m013['walk_forward']['summary'],
              'metrics':m013['walk_forward']['metrics'],
              'test_pass':e013['overall']['TEST_PASS'],
          }, indent=2))
          print('M014')
          print(json.dumps({
              'gate_results':m014['gate_results'],
              'model_state':m014['model_state'],
              'decision_weight':m014['decision_weight'],
              'evaluation_classification':m014['walk_forward']['evaluation_classification'],
              'summary':m014['walk_forward']['summary'],
              'metrics':m014['walk_forward']['metrics'],
              'test_pass':e014['overall']['TEST_PASS'],
          }, indent=2))
          print('GATE4')
          print(json.dumps({
              'n':g4['n'],
              'descriptive_leader':g4['descriptive_leader'],
              'promotion_state':g4['promotion_state'],
              'promote_poisson':g4['promote_poisson'],
              'checks':g4['checks'],
              'missing_challengers':g4['missing_challengers'],
              'reasons':g4['reasons'],
          }, indent=2))
          PY

      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: real-historical-gate1-gate4-reports
          path: |
            artifacts/real-2026-historical-research-report.json
            artifacts/m011r-walkforward-report-v0.1.json
            artifacts/m011r/TEST_EVIDENCE.json
            artifacts/m013-walkforward-report-v0.1.json
            artifacts/m013/TEST_EVIDENCE.json
            artifacts/m014-walkforward-report-v0.1.json
            artifacts/m014/TEST_EVIDENCE.json
            artifacts/real-gate4-robustness-report.json
          if-no-files-found: error
