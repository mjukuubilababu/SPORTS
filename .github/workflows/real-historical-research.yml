name: Real Historical Research

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run historical pipeline unit tests
        run: |
          python scripts/test_canonical_historical_pipeline.py
          python scripts/test_cross_source_result_reconciler.py
          python scripts/test_historical_closing_market_join.py
          python scripts/test_gate2_gate3_settled_corpus.py
          python scripts/test_footiqo_fixture_reconciler.py
          python scripts/test_gate3_gate4_real_robustness.py
          python scripts/test_evaluation_freeze_challenger_protocol.py
          python scripts/test_m011r_bayesian_calibrator.py
          python scripts/test_m013_negative_binomial.py
          python scripts/test_m014_hierarchical_attack_defence.py
          python scripts/test_m015_regularized_poisson_glm.py
          python scripts/test_m015_forward_validation.py
          python scripts/test_m015_forward_evidence_ledger.py
          python scripts/test_m015_forward_target_capture.py

      - name: Run real historical research runtime
        run: python scripts/run_real_2026_historical_research.py --bootstrap-reps 2000

      - name: Run M011R real walk-forward challenger
        run: python scripts/run_m011r_walkforward.py

      - name: Run M013 negative-binomial walk-forward diagnostic
        run: python scripts/run_m013_walkforward.py

      - name: Run M014 hierarchical attack-defence walk-forward diagnostic
        run: python scripts/run_m014_walkforward.py

      - name: Run M015 regularized Poisson GLM walk-forward diagnostic
        run: python scripts/run_m015_walkforward.py

      - name: Verify M015 preregistered forward validation state
        run: python scripts/run_m015_forward_validation.py

      - name: Verify M015 append-only forward evidence ledger
        run: python scripts/run_m015_forward_evidence_ledger.py

      - name: Verify M015 prospective target capture readiness
        run: python scripts/run_m015_forward_target_capture_readiness.py

      - name: Run Gate4 real robustness adapter
        run: |
          python packages/gate4/run_canonical_robustness.py \
            artifacts/real-2026-historical-research-report.json \
            artifacts/real-gate4-robustness-report.json

      - name: Print empirical headline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g3=json.loads(Path('artifacts/real-2026-historical-research-report.json').read_text())
          g4=json.loads(Path('artifacts/real-gate4-robustness-report.json').read_text())
          m011r=json.loads(Path('artifacts/m011r-walkforward-report-v0.1.json').read_text())
          e011r=json.loads(Path('artifacts/m011r/TEST_EVIDENCE.json').read_text())
          m013=json.loads(Path('artifacts/m013-walkforward-report-v0.1.json').read_text())
          e013=json.loads(Path('artifacts/m013/TEST_EVIDENCE.json').read_text())
          m014=json.loads(Path('artifacts/m014-walkforward-report-v0.1.json').read_text())
          e014=json.loads(Path('artifacts/m014/TEST_EVIDENCE.json').read_text())
          m015=json.loads(Path('artifacts/m015-walkforward-report-v0.1.json').read_text())
          e015=json.loads(Path('artifacts/m015/TEST_EVIDENCE.json').read_text())
          f015=json.loads(Path('artifacts/m015-forward-validation-report-v0.1.json').read_text())
          ef015=json.loads(Path('artifacts/m015-forward/TEST_EVIDENCE.json').read_text())
          l015=json.loads(Path('artifacts/m015-forward-evidence-ledger-report-v0.1.json').read_text())
          el015=json.loads(Path('artifacts/m015-forward-ledger/TEST_EVIDENCE.json').read_text())
          t015=json.loads(Path('artifacts/m015-forward-target-capture-readiness-v0.1.json').read_text())
          et015=json.loads(Path('artifacts/m015-forward-target/TEST_EVIDENCE.json').read_text())
          print('GATE3')
          print(json.dumps(g3['headline'], indent=2))
          print('M011R')
          print(json.dumps({
              'gate_results':m011r['gate_results'],
              'model_state':m011r['model_state'],
              'decision_weight':m011r['decision_weight'],
              'summary':m011r['walk_forward']['summary'],
              'metrics':m011r['walk_forward']['metrics'],
              'test_pass':e011r['overall']['TEST_PASS'],
          }, indent=2))
          print('M013')
          print(json.dumps({
              'gate_results':m013['gate_results'],
              'model_state':m013['model_state'],
              'decision_weight':m013['decision_weight'],
              'evaluation_classification':m013['walk_forward']['evaluation_classification'],
              'summary':m013['walk_forward']['summary'],
              'metrics':m013['walk_forward']['metrics'],
              'test_pass':e013['overall']['TEST_PASS'],
          }, indent=2))
          print('M014')
          print(json.dumps({
              'gate_results':m014['gate_results'],
              'model_state':m014['model_state'],
              'decision_weight':m014['decision_weight'],
              'evaluation_classification':m014['walk_forward']['evaluation_classification'],
              'summary':m014['walk_forward']['summary'],
              'metrics':m014['walk_forward']['metrics'],
              'test_pass':e014['overall']['TEST_PASS'],
          }, indent=2))
          print('M015')
          print(json.dumps({
              'gate_results':m015['gate_results'],
              'model_state':m015['model_state'],
              'decision_weight':m015['decision_weight'],
              'evaluation_classification':m015['walk_forward']['evaluation_classification'],
              'summary':m015['walk_forward']['summary'],
              'metrics':m015['walk_forward']['metrics'],
              'test_pass':e015['overall']['TEST_PASS'],
          }, indent=2))
          print('M015_FORWARD')
          print(json.dumps({
              'registration_state':f015['registration']['state'],
              'summary':f015['forward_validation']['summary'],
              'gate_results':f015['forward_validation']['gate_results'],
              'validation_state':f015['forward_validation']['validation_state'],
              'model_state':f015['forward_validation']['model_state'],
              'decision_weight':f015['forward_validation']['decision_weight'],
              'test_waiting':ef015['overall']['TEST_WAITING'],
          }, indent=2))
          print('M015_FORWARD_LEDGER')
          print(json.dumps({
              'ledger_valid':l015['ledger_verification']['ledger_valid'],
              'entry_n':l015['ledger_verification']['entry_n'],
              'pending_n':l015['ledger_verification']['pending_n'],
              'settled_n':l015['ledger_verification']['settled_n'],
              'current_forward_state':l015['current_forward_state'],
              'infrastructure_test_pass':el015['overall']['INFRASTRUCTURE_TEST_PASS'],
              'model_validation_pass':el015['overall']['MODEL_VALIDATION_PASS'],
              'model_validation_waiting':el015['overall']['MODEL_VALIDATION_WAITING'],
          }, indent=2))
          print('M015_FORWARD_TARGET_CAPTURE')
          print(json.dumps({
              'readiness_state':t015['readiness_state'],
              'training_state':t015['training_state'],
              'ledger':t015['ledger'],
              'infrastructure_test_pass':et015['overall']['INFRASTRUCTURE_TEST_PASS'],
              'target_captured_by_this_check':et015['overall']['TARGET_CAPTURED_BY_THIS_CHECK'],
          }, indent=2))
          print('GATE4')
          print(json.dumps({
              'n':g4['n'],
              'descriptive_leader':g4['descriptive_leader'],
              'promotion_state':g4['promotion_state'],
              'promote_poisson':g4['promote_poisson'],
              'checks':g4['checks'],
              'missing_challengers':g4['missing_challengers'],
              'reasons':g4['reasons'],
          }, indent=2))
          PY

      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: real-historical-gate1-gate4-reports
          path: |
            artifacts/real-2026-historical-research-report.json
            artifacts/m011r-walkforward-report-v0.1.json
            artifacts/m011r/TEST_EVIDENCE.json
            artifacts/m013-walkforward-report-v0.1.json
            artifacts/m013/TEST_EVIDENCE.json
            artifacts/m014-walkforward-report-v0.1.json
            artifacts/m014/TEST_EVIDENCE.json
            artifacts/m015-walkforward-report-v0.1.json
            artifacts/m015/TEST_EVIDENCE.json
            artifacts/m015-forward-validation-report-v0.1.json
            artifacts/m015-forward/TEST_EVIDENCE.json
            artifacts/m015-forward-evidence-ledger-report-v0.1.json
            artifacts/m015-forward-ledger/TEST_EVIDENCE.json
            artifacts/m015-forward-target-capture-readiness-v0.1.json
            artifacts/m015-forward-target/TEST_EVIDENCE.json
            artifacts/real-gate4-robustness-report.json
          if-no-files-found: error
