name: Pattern Confirmatory Out-of-Sample Evaluation v0.1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pattern-confirmatory-oos:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce Step 6 introduction scope or protect Step 6 artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$BASE" || -z "$HEAD" ]]; then
            echo "STEP6_SCOPE_GUARD_REQUIRES_PULL_REQUEST"
            exit 1
          fi
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          printf '%s\n' "${rows[@]}"
          owned=(
            "contracts/pattern-confirmatory-out-of-sample-evaluation-v0.1.json"
            "packages/intelligence-engine/src/pattern-confirmatory-out-of-sample-evaluation.mjs"
            "packages/intelligence-engine/tests/pattern-confirmatory-out-of-sample-evaluation.test.mjs"
            "packages/intelligence-engine/docs/PATTERN_CONFIRMATORY_OUT_OF_SAMPLE_EVALUATION_V0_1.md"
            ".github/workflows/pattern-confirmatory-out-of-sample-evaluation-v0.1.yml"
          )
          if ! git cat-file -e "$BASE:contracts/pattern-confirmatory-out-of-sample-evaluation-v0.1.json" 2>/dev/null; then
            declare -A seen=()
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"; matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" == "A" ]] || { echo "STEP6_INTRODUCTION_FILE_MUST_BE_ADDED: $row"; exit 1; }
                  seen["$path"]=1; matched=true; break
                fi
              done
              [[ "$matched" == true ]] || { echo "STEP6_UNEXPECTED_INTRODUCTION_CHANGE: $row"; exit 1; }
            done
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP6_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP6_INTRODUCTION_FILE_SET_INCOMPLETE"; exit 1; }
            echo "STEP6_INTRODUCTION_SCOPE=PASS"
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  case "$status" in D|R*) echo "STEP6_OWNED_ARTIFACT_DELETION_OR_RENAME_FORBIDDEN: $row"; exit 1 ;; esac
                fi
              done
            done
            echo "STEP6_FORWARD_COMPATIBILITY_PROTECTOR=PASS"
          fi

      - name: Validate Step 4-6 contracts and frozen governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          step4=json.loads(Path('contracts/pattern-discovery-candidates-v0.1.json').read_text())
          step5=json.loads(Path('contracts/pattern-candidate-confirmatory-freeze-v0.1.json').read_text())
          step6=json.loads(Path('contracts/pattern-confirmatory-out-of-sample-evaluation-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          assert step4['contract_id']=='PATTERN_DISCOVERY_CANDIDATES_V0_1'
          assert step4['status']=='STEP_4_IMPLEMENTED'
          assert step5['contract_id']=='PATTERN_CANDIDATE_CONFIRMATORY_FREEZE_V0_1'
          assert step5['status']=='STEP_5_IMPLEMENTED'
          assert step5['next_stage']=='STEP_6_PATTERN_CONFIRMATORY_OUT_OF_SAMPLE_EVALUATION'
          assert step6['contract_id']=='PATTERN_CONFIRMATORY_OUT_OF_SAMPLE_EVALUATION_V0_1'
          assert step6['status']=='STEP_6_IMPLEMENTED'
          assert step6['sample_governance']['subject_match_n_min']==30
          assert step6['sample_governance']['subject_metric_opportunity_n_min']==30
          assert step6['sample_governance']['reference_metric_opportunity_n_min']==30
          assert step6['sample_governance']['subject_independent_match_cluster_n_min']==30
          assert step6['sample_governance']['reference_independent_match_cluster_n_min']==30
          assert step6['estimand_and_test']['minimum_practical_effect_absolute']==0.10
          assert step6['estimand_and_test']['raw_test_method']=='ONE_SIDED_MATCH_CLUSTER_ROBUST_SCORE_CR1_NORMAL'
          assert step6['multiple_testing']['familywise_alpha']==0.05
          assert step6['multiple_testing']['method']=='HOLM_BONFERRONI'
          assert step6['multiple_testing']['retesting_different_corpus_after_alpha_spend_allowed'] is False
          assert step6['real_evidence_boundary']['synthetic_unit_test_rows_may_count_as_real_confirmation'] is False
          assert step6['real_evidence_boundary']['step6_implementation_itself_claims_a_real_confirmatory_pass'] is False
          assert step6['decision_boundary']['pattern_validated_in_step6'] is False
          assert step6['decision_boundary']['decision_weight']==0
          assert step6['governance']['p002_changed'] is False
          assert step6['governance']['gate1_to_gate6_ownership_changed'] is False
          assert step6['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['discovery_min_n']==30
          assert p002['independent_validation_min_n']==30
          assert p002['capital_effect']=='NONE_UNTIL_GOVERNED_EVIDENCE'
          print('STEP4_TO_STEP6_CONTRACT_CHAIN=PASS')
          print('MATCH_CLUSTER_ROBUST_CONFIRMATORY_TEST=PASS')
          print('HOLM_SINGLE_SHOT_ALPHA_DISCIPLINE=PASS')
          print('REAL_RESULT_NOT_FABRICATED=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Run Step 5 regression
        run: node --test packages/intelligence-engine/tests/pattern-candidate-confirmatory-freeze.test.mjs

      - name: Run Step 6 tests
        run: node --test packages/intelligence-engine/tests/pattern-confirmatory-out-of-sample-evaluation.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1
          rm -rf /tmp/step6-base /tmp/step6-head
          git worktree add --detach /tmp/step6-base "$BASE"
          git worktree add --detach /tmp/step6-head "$HEAD"
          set +e
          (cd /tmp/step6-base/packages/intelligence-engine && npm test) > /tmp/step6-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step6-head/packages/intelligence-engine && npm test) > /tmp/step6-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s\n' "$BASE_RC" > /tmp/step6-base.rc
          printf '%s\n' "$HEAD_RC" > /tmp/step6-head.rc
          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          def failures(path):
            out=[]
            for line in Path(path).read_text(errors='replace').splitlines():
              text=line.strip(); m=tap.match(text) or glyph.match(text)
              if m: out.append(m.group(1).strip())
            return sorted(set(out))
          brc=int(Path('/tmp/step6-base.rc').read_text()); hrc=int(Path('/tmp/step6-head.rc').read_text())
          base=failures('/tmp/step6-base.log'); head=failures('/tmp/step6-head.log')
          if brc!=0 and not base: raise SystemExit('STEP6_UNPARSED_CANONICAL_BASE_TEST_FAILURE_DEBT')
          if hrc!=0 and not head: raise SystemExit('STEP6_UNPARSED_HEAD_TEST_FAILURE_DEBT')
          if brc!=hrc: raise SystemExit('STEP6_NPM_TEST_EXIT_CODE_CHANGED')
          if base!=head: raise SystemExit('STEP6_REGRESSION_FAILURE_SET_CHANGED')
          summary={'comparison':'CANONICAL_BASE_VS_STEP6_HEAD','node_version':'20','base_npm_test_rc':brc,'head_npm_test_rc':hrc,'npm_test_rc_parity':brc==hrc,'base_failure_n':len(base),'head_failure_n':len(head),'base_failures':base,'head_failures':head,'new_failure_names':sorted(set(head)-set(base)),'removed_failure_names':sorted(set(base)-set(head)),'failure_name_delta_zero':base==head,'canonical_baseline_has_existing_failures':brc!=0}
          Path('artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          echo "STEP6_REGRESSION_DELTA=0"

      - name: Write Step 6 test evidence
        run: |
          mkdir -p artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          rp=Path('artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1/REGRESSION_BASELINE.json')
          regression=json.loads(rp.read_text()) if rp.exists() else None
          evidence={
            'artifact':'Pattern_Confirmatory_Out_of_Sample_Evaluation_v0.1',
            'step':'STEP_6_PATTERN_CONFIRMATORY_OUT_OF_SAMPLE_EVALUATION',
            'overall':{'TEST_AUTHORED':True,'TEST_EXECUTED':True,'TEST_PASS':True,'STEP_6_IMPLEMENTATION_COMPLETE':True,'ADDED_FILES':5,'MODIFIED_EXISTING_FILES':0,'DELETED_EXISTING_FILES':0,'REGRESSION_DELTA_ZERO':None if regression is None else regression['failure_name_delta_zero']},
            'capabilities':{'DISJOINT_OOS_BOUNDARY':True,'MATCH_CLUSTER_ROBUST_TEST':True,'RAW_TEST_METHOD':'ONE_SIDED_MATCH_CLUSTER_ROBUST_SCORE_CR1_NORMAL','SUBJECT_MIN_N':30,'REFERENCE_MIN_N':30,'SUBJECT_MIN_CLUSTER_N':30,'REFERENCE_MIN_CLUSTER_N':30,'MINIMUM_PRACTICAL_EFFECT':0.10,'FAMILYWISE_ALPHA':0.05,'MULTIPLE_TESTING_METHOD':'HOLM_BONFERRONI','ALL_FAMILY_READY_BEFORE_ALPHA_SPEND':True,'RETEST_DIFFERENT_CORPUS_AFTER_ALPHA_SPEND':False,'FAILED_CANDIDATE_RETAINED':True,'PATTERN_VALIDATED':False,'PREDICTIVE_WEIGHT':0},
            'real_evidence_status':{'REAL_CONFIRMATORY_EVALUATION_EXECUTED_IN_CI':False,'SYNTHETIC_TEST_FIXTURES_ONLY':True,'SYNTHETIC_RESULTS_COUNT_AS_REAL_CONFIRMATION':False,'REAL_PATTERN_PASS_CLAIMED_BY_STEP6_IMPLEMENTATION':False,'CURRENT_REAL_STATUS':'NOT_RUN_WAITING_FOR_REAL_FROZEN_BATCH_AND_DISJOINT_EVIDENCE'},
            'regression_baseline':regression,
            'governance':{'P002_UNCHANGED':True,'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,'AUTOMATIC_RETUNING':False,'AUTOMATIC_PATTERN_PROMOTION':False,'CAPITAL_EFFECT':'NONE','REAL_MONEY':'NO'},
            'hashes':{'contract_sha256':sha('contracts/pattern-confirmatory-out-of-sample-evaluation-v0.1.json'),'runtime_sha256':sha('packages/intelligence-engine/src/pattern-confirmatory-out-of-sample-evaluation.mjs'),'test_sha256':sha('packages/intelligence-engine/tests/pattern-confirmatory-out-of-sample-evaluation.test.mjs'),'docs_sha256':sha('packages/intelligence-engine/docs/PATTERN_CONFIRMATORY_OUT_OF_SAMPLE_EVALUATION_V0_1.md'),'p002_sha256':sha('contracts/p002-frozen-rules.json')},
            'next_stage':'STEP_7_PATTERN_TEMPORAL_AND_CONTEXT_STABILITY'
          }
          Path('artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1/TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pattern-confirmatory-out-of-sample-evaluation-v0.1-evidence
          path: |
            artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1/TEST_EVIDENCE.json
            artifacts/pattern-confirmatory-out-of-sample-evaluation-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
