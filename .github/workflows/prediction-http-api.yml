name: Prediction HTTP API

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
    paths:
      - 'packages/prediction-api/**'
      - 'packages/reference-e2e/migrations/0008_frozen_signal_prediction_api_reference_v0_1.sql'
      - 'packages/reference-e2e/migrations/0009_downstream_lineage_attestation_feature_payload_v0_1.sql'
      - 'packages/reference-e2e/src/postgres-ingestion-provenance.mjs'
      - 'packages/reference-e2e/src/postgres-feature-model-signal-lineage.mjs'
      - 'packages/intelligence-engine/src/model-probability-orchestrator.mjs'
      - 'packages/intelligence-engine/src/probabilistic-brain.mjs'
      - 'packages/intelligence-engine/src/live-outcome.mjs'
      - 'packages/intelligence-engine/src/outcome-1x2.mjs'
      - 'scripts/verify_unified.py'
      - 'contracts/prediction-http-api-v0.1.json'
      - 'contracts/prediction-live-http-api-v0.1.json'
      - 'docs/prediction-http-api-v0.1.md'
      - 'docs/prediction-live-http-api-v0.1.md'
      - 'manifests/prediction-http-api-v0.1.json'
      - 'manifests/prediction-live-http-api-v0.1.json'
      - '.github/workflows/prediction-http-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: decision_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d decision_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/decision_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply PostgreSQL lineage and prediction migrations
        run: |
          set -euo pipefail
          for migration in packages/reference-e2e/migrations/0002_reference_evidence_postgres_v0_1.sql packages/reference-e2e/migrations/0003_reference_stage_checkpoints_postgres_v0_1.sql packages/reference-e2e/migrations/0004_reference_run_leases_fencing_postgres_v0_1.sql packages/reference-e2e/migrations/0005_ingestion_provenance_postgres_v0_1.sql packages/reference-e2e/migrations/0006_feature_model_frozen_signal_lineage_postgres_v0_1.sql packages/reference-e2e/migrations/0007_feature_model_signal_lineage_review_fixes_v0_1.sql packages/reference-e2e/migrations/0008_frozen_signal_prediction_api_reference_v0_1.sql packages/reference-e2e/migrations/0009_downstream_lineage_attestation_feature_payload_v0_1.sql packages/prediction-api/migrations/0015_prediction_snapshots_v0_1.sql packages/prediction-api/migrations/0016_prediction_frozen_signal_lineage_v0_1.sql packages/prediction-api/migrations/0017_prediction_outcome_validation_lineage_v0_1.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0008_frozen_signal_prediction_api_reference_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/prediction-api/migrations/0016_prediction_frozen_signal_lineage_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/prediction-api/migrations/0017_prediction_outcome_validation_lineage_v0_1.sql
      - name: Install API dependencies
        working-directory: packages/prediction-api
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Run API tests
        working-directory: packages/prediction-api
        run: npm run verify
      - name: Run orchestrator regression
        working-directory: packages/intelligence-engine
        run: node --test tests/model-probability-orchestrator.test.mjs
      - name: Run live outcome regression
        working-directory: packages/intelligence-engine
        run: node --test tests/outcome-1x2.test.mjs
      - name: Run unified repository verifier
        run: python scripts/verify_unified.py
      - name: Assert API governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifests/prediction-http-api-v0.1.json').read_text())
          live=json.loads(Path('manifests/prediction-live-http-api-v0.1.json').read_text())
          r=json.loads(Path('artifacts/unified-verification-report.json').read_text())
          assert m['model_logic_duplicated'] is False
          assert m['capital_effect'] == 'NONE'
          assert m['real_money'] == 'NO'
          assert live['model_logic_duplicated'] is False
          assert live['arbitrary_rate_multiplier_override_allowed'] is False
          assert live['provider_prediction_used'] is False
          assert live['bookmaker_odds_used_as_live_model_input'] is False
          assert live['prematch_snapshot_immutable'] is True
          assert live['capital_effect'] == 'NONE'
          assert live['real_money'] == 'NO'
          assert r['core_integrated_assurance'] == 'PROMOTE'
          assert r['tests_total'] == r['tests_passed']
          assert r['capital_assurance'] == 'LOCKED'
          print(json.dumps({'api':'PASS','live_api':'PASS','unified':f"{r['tests_passed']}/{r['tests_total']}",'capital':r['capital_assurance']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prediction-http-api-v0.1
          path: |
            manifests/prediction-http-api-v0.1.json
            manifests/prediction-live-http-api-v0.1.json
            contracts/prediction-http-api-v0.1.json
            contracts/prediction-live-http-api-v0.1.json
            artifacts/unified-verification-report.json
            artifacts/unified-verification.log
          if-no-files-found: error
