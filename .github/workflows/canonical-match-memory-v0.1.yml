name: Canonical Match Memory v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-match-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce Step 1 scope and authorized compatibility fix
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          printf '%s\n' "${rows[@]}"

          step1_added=(
            "contracts/canonical-match-memory-v0.1.json"
            "packages/intelligence-engine/src/canonical-match-memory.mjs"
            "packages/intelligence-engine/tests/canonical-match-memory.test.mjs"
            "packages/intelligence-engine/docs/CANONICAL_MATCH_MEMORY_V0_1.md"
            ".github/workflows/canonical-match-memory-v0.1.yml"
          )
          compatibility_modified=".github/workflows/pattern-intelligence-contract-v0.1.yml"

          declare -A seen_added=()
          seen_compat=false
          for row in "${rows[@]}"; do
            status="${row%%$'\t'*}"
            path="${row#*$'\t'}"
            matched=false
            for item in "${step1_added[@]}"; do
              if [[ "$path" == "$item" ]]; then
                [[ "$status" == "A" ]] || { echo "STEP1_EXPECTED_ADDED_FILE: $row"; exit 1; }
                seen_added["$path"]=1
                matched=true
                break
              fi
            done
            if [[ "$matched" == true ]]; then continue; fi

            if [[ "$path" == "$compatibility_modified" ]]; then
              [[ "$status" == "M" ]] || { echo "STEP0_COMPATIBILITY_FIX_EXPECTED_MODIFICATION: $row"; exit 1; }
              seen_compat=true
              continue
            fi

            echo "STEP1_UNEXPECTED_CHANGE: $row"
            exit 1
          done

          [[ "${#rows[@]}" -eq 6 ]] || { echo "STEP1_EXPECTED_5_ADDITIONS_PLUS_1_COMPATIBILITY_MODIFICATION"; exit 1; }
          [[ "${#seen_added[@]}" -eq 5 ]] || { echo "STEP1_ADDED_FILE_SET_INCOMPLETE"; exit 1; }
          [[ "$seen_compat" == true ]] || { echo "STEP0_COMPATIBILITY_MODIFICATION_MISSING"; exit 1; }
          echo "STEP1_SCOPE=PASS"
          echo "STEP1_FILES_ADDITIVE_ONLY=PASS"
          echo "AUTHORIZED_STEP0_COMPATIBILITY_MODIFICATION=PASS"

      - name: Validate contracts and preserved ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          memory=json.loads(Path('contracts/canonical-match-memory-v0.1.json').read_text())
          pattern=json.loads(Path('contracts/pattern-intelligence-contract-v0.1.json').read_text())
          truth=json.loads(Path('contracts/canonical-historical-truth-store-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())

          assert memory['contract_id']=='CANONICAL_MATCH_MEMORY_V0_1'
          assert memory['status']=='STEP_1_IMPLEMENTED'
          assert memory['depends_on']['pattern_intelligence_contract']==pattern['contract_id']
          assert memory['depends_on']['canonical_truth_store']==truth['store_version']
          assert memory['memory_semantics']['authoritative_truth_owner']=='GATE1'
          assert memory['memory_semantics']['match_memory_is_derived_materialized_view'] is True
          assert memory['memory_semantics']['correct_predictions_retained'] is True
          assert memory['memory_semantics']['incorrect_predictions_retained'] is True
          assert memory['memory_semantics']['outcome_based_deletion_forbidden'] is True
          assert memory['pattern_eligibility']['verified_truth_required'] is True
          assert memory['pattern_eligibility']['quarantined_truth_decision_weight']==0
          assert memory['timeline_boundary']['step_1_timeline_state']=='STEP_2_PENDING'
          assert memory['timeline_boundary']['minute_by_minute_goal_card_substitution_modeling_in_step_1'] is False
          assert memory['governance']['gate1_to_gate6_ownership_changed'] is False
          assert memory['governance']['p002_changed'] is False
          assert memory['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['o25_max']==1.60
          assert p002['u35_min']==1.55
          assert p002['u35_max']==1.75
          assert p002['lambda_min']==2.70
          assert p002['lambda_max']==3.10
          assert p002['raw_model_edge_pp_min']==5.0
          assert p002['discovery_min_n']==30
          assert p002['independent_validation_min_n']==30
          assert p002['model_mls_prior_weights']==[0.5,0.5]
          assert p002['prior_equivalent_sample_size']==5
          assert p002['lineup_lambda_adjustment']==0.10
          assert p002['capital_effect']=='NONE_UNTIL_GOVERNED_EVIDENCE'
          for path in [
              'packages/gate1/historical_truth_importer.py',
              'packages/intelligence-engine/src/evidence-graph.mjs',
              'packages/intelligence-engine/src/outcome-settlement.mjs',
              'packages/intelligence-engine/src/governed-learning-loop.mjs',
              '.github/workflows/pattern-intelligence-contract-v0.1.yml',
          ]:
              assert Path(path).exists(), path
          print('CANONICAL_MATCH_MEMORY_CONTRACT=PASS')
          print('P002_UNCHANGED=PASS')
          print('EXISTING_OWNERS_PRESENT=PASS')
          print('STEP0_FORWARD_COMPATIBILITY_INTEGRATED=PASS')
          PY

      - name: Run Canonical Match Memory tests
        run: node packages/intelligence-engine/tests/canonical-match-memory.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/canonical-match-memory-v0.1
          rm -rf /tmp/step1-base /tmp/step1-head
          git worktree add --detach /tmp/step1-base "$BASE"
          git worktree add --detach /tmp/step1-head "$HEAD"

          set +e
          (cd /tmp/step1-base/packages/intelligence-engine && npm test) > /tmp/step1-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step1-head/packages/intelligence-engine && npm test) > /tmp/step1-head.log 2>&1
          HEAD_RC=$?
          set -e

          python - <<'PY'
          import json, re
          from pathlib import Path

          pattern=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          def failures(path):
              out=[]
              for line in Path(path).read_text(errors='replace').splitlines():
                  m=pattern.match(line.strip())
                  if m:
                      out.append(m.group(1).strip())
              return sorted(set(out))

          base=failures('/tmp/step1-base.log')
          head=failures('/tmp/step1-head.log')
          summary={
              'comparison':'CANONICAL_BASE_VS_STEP1_HEAD',
              'base_failure_n':len(base),
              'head_failure_n':len(head),
              'base_failures':base,
              'head_failures':head,
              'new_failure_names':sorted(set(head)-set(base)),
              'removed_failure_names':sorted(set(base)-set(head)),
              'failure_name_delta_zero':base==head,
          }
          Path('artifacts/canonical-match-memory-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          if base != head:
              raise SystemExit('STEP1_REGRESSION_FAILURE_SET_CHANGED')
          PY

          echo "BASE_NPM_TEST_RC=$BASE_RC"
          echo "HEAD_NPM_TEST_RC=$HEAD_RC"
          if [[ "$BASE_RC" -eq 0 && "$HEAD_RC" -ne 0 ]]; then
            echo "STEP1_INTRODUCED_REGRESSION"
            cat /tmp/step1-head.log
            exit 1
          fi
          echo "STEP1_REGRESSION_DELTA=0"
          if [[ "$BASE_RC" -ne 0 ]]; then
            echo "CANONICAL_BASELINE_HAS_EXISTING_TEST_FAILURES=TRUE"
          else
            echo "CANONICAL_BASELINE_HAS_EXISTING_TEST_FAILURES=FALSE"
          fi

      - name: Write Step 1 test evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/canonical-match-memory-v0.1
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          regression_path=Path('artifacts/canonical-match-memory-v0.1/REGRESSION_BASELINE.json')
          regression=json.loads(regression_path.read_text()) if regression_path.exists() else {
              'comparison':'NOT_AVAILABLE_ON_WORKFLOW_DISPATCH',
              'base_failure_n':None,
              'head_failure_n':None,
              'base_failures':[],
              'head_failures':[],
              'new_failure_names':[],
              'removed_failure_names':[],
              'failure_name_delta_zero':None,
          }

          evidence={
            'artifact':'Canonical_Match_Memory_v0.1',
            'step':'STEP_1_CANONICAL_MATCH_MEMORY',
            'overall':{
              'TEST_AUTHORED':True,
              'TEST_EXECUTED':True,
              'TEST_PASS':True,
              'STEP_1_COMPLETE':True,
              'STEP1_FILES_ADDITIVE_ONLY':True,
              'AUTHORIZED_COMPATIBILITY_MODIFICATION_N':1,
              'AUTHORIZED_COMPATIBILITY_MODIFICATION':'.github/workflows/pattern-intelligence-contract-v0.1.yml',
              'EXISTING_ARTIFACTS_DELETED':0,
              'EXISTING_CANONICAL_OWNERS_REPLACED':0,
              'REGRESSION_DELTA_ZERO':regression['failure_name_delta_zero'],
              'CANONICAL_BASELINE_EXISTING_FAILURE_N':regression['base_failure_n'],
              'STEP1_HEAD_FAILURE_N':regression['head_failure_n'],
            },
            'capabilities':{
              'WIN_DRAW_LOSS_SAME_SCHEMA':True,
              'TRUTH_PROVENANCE_RETAINED':True,
              'OBSERVATION_TIMESTAMPS_RETAINED':True,
              'CORRECT_PREDICTION_RETAINED':True,
              'INCORRECT_PREDICTION_RETAINED':True,
              'UNVERIFIED_TRUTH_RETAINED_BUT_PATTERN_INELIGIBLE':True,
              'POST_CUTOFF_EVIDENCE_RETAINED_BUT_PREMATCH_INELIGIBLE':True,
              'DETERMINISTIC_TRUTH_FINGERPRINT':True,
              'DETERMINISTIC_MEMORY_FINGERPRINT':True,
              'TAMPER_DETECTION':True,
              'STEP0_FORWARD_COMPATIBILITY_INTEGRATED':True,
              'GAME_STATE_TIMELINE_IMPLEMENTED':False,
              'GAME_STATE_TIMELINE_STATE':'STEP_2_PENDING',
              'PATTERN_DISCOVERY_IMPLEMENTED_BY_STEP_1':False,
            },
            'regression_baseline':regression,
            'governance':{
              'AUTHORITATIVE_TRUTH_OWNER':'GATE1',
              'MATCH_MEMORY_ROLE':'DERIVED_IMMUTABLE_MATERIALIZED_VIEW',
              'P002_UNCHANGED':True,
              'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,
              'NO_HINDSIGHT':True,
              'AUTOMATIC_RETUNING':False,
              'AUTOMATIC_PATTERN_PROMOTION':False,
              'EXISTING_BASELINE_TEST_DEBT_WAS_NOT_MODIFIED_BY_STEP1':True,
              'DESTRUCTIVE_CHANGE':False,
              'CAPITAL_EFFECT':'NONE',
              'REAL_MONEY':'NO',
            },
            'hashes':{
              'match_memory_contract_sha256':sha('contracts/canonical-match-memory-v0.1.json'),
              'pattern_intelligence_contract_sha256':sha('contracts/pattern-intelligence-contract-v0.1.json'),
              'p002_sha256':sha('contracts/p002-frozen-rules.json'),
              'runtime_sha256':sha('packages/intelligence-engine/src/canonical-match-memory.mjs'),
              'test_sha256':sha('packages/intelligence-engine/tests/canonical-match-memory.test.mjs'),
              'step0_workflow_sha256':sha('.github/workflows/pattern-intelligence-contract-v0.1.yml'),
            },
            'next_stage':'STEP_2_GAME_STATE_TIMELINE'
          }
          Path('artifacts/canonical-match-memory-v0.1/TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-match-memory-v0.1-evidence
          path: |
            artifacts/canonical-match-memory-v0.1/TEST_EVIDENCE.json
            artifacts/canonical-match-memory-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
