name: Behavioral State Features v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-behavioral-state-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce Step 3 introduction scope or protect Step 3 artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          printf '%s\n' "${rows[@]}"

          introduction=false
          for row in "${rows[@]}"; do
            if [[ "$row" == $'A\tcontracts/behavioral-state-features-v0.1.json' ]]; then introduction=true; fi
          done

          owned=(
            "contracts/behavioral-state-features-v0.1.json"
            "packages/intelligence-engine/src/behavioral-state-features.mjs"
            "packages/intelligence-engine/tests/behavioral-state-features.test.mjs"
            "packages/intelligence-engine/docs/BEHAVIORAL_STATE_FEATURES_V0_1.md"
            ".github/workflows/behavioral-state-features-v0.1.yml"
          )

          if [[ "$introduction" == true ]]; then
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP3_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            declare -A seen
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"
              path="${row#*$'\t'}"
              [[ "$status" == "A" ]] || { echo "STEP3_NON_ADDITIVE_INTRODUCTION_CHANGE: $row"; exit 1; }
              matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then matched=true; seen["$path"]=1; break; fi
              done
              [[ "$matched" == true ]] || { echo "STEP3_UNEXPECTED_INTRODUCTION_FILE: $path"; exit 1; }
            done
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP3_FILE_SET_INCOMPLETE"; exit 1; }
            echo "STEP3_INTRODUCTION_SCOPE=PASS"
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"
              path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" != D* ]] || { echo "STEP3_OWNED_ARTIFACT_DELETE_FORBIDDEN: $row"; exit 1; }
                  [[ "$status" != R* ]] || { echo "STEP3_OWNED_ARTIFACT_RENAME_FORBIDDEN: $row"; exit 1; }
                fi
              done
            done
            echo "STEP3_FORWARD_COMPATIBILITY_GUARD=PASS"
          fi

      - name: Validate Step 0-3 contracts and frozen governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pattern=json.loads(Path('contracts/pattern-intelligence-contract-v0.1.json').read_text())
          memory=json.loads(Path('contracts/canonical-match-memory-v0.1.json').read_text())
          timeline=json.loads(Path('contracts/game-state-timeline-v0.1.json').read_text())
          behavioral=json.loads(Path('contracts/behavioral-state-features-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())

          assert pattern['status']=='ARCHITECTURE_FROZEN_SPEC_ONLY'
          assert memory['status']=='STEP_1_IMPLEMENTED'
          assert timeline['status']=='STEP_2_IMPLEMENTED'
          assert behavioral['contract_id']=='BEHAVIORAL_STATE_FEATURES_V0_1'
          assert behavioral['status']=='STEP_3_IMPLEMENTED'
          assert behavioral['scope']=='GLOBAL_FOOTBALL_LEAGUE_AGNOSTIC'
          assert behavioral['depends_on']['pattern_intelligence_contract']==pattern['contract_id']
          assert behavioral['depends_on']['canonical_match_memory']==memory['contract_id']
          assert behavioral['depends_on']['game_state_timeline']==timeline['contract_id']
          assert behavioral['retention_policy']['win_draw_loss_all_retained'] is True
          assert behavioral['aggregation_rules']['binary_metrics_use_explicit_opportunity_denominator'] is True
          assert behavioral['aggregation_rules']['zero_opportunity_rate'] is None
          assert behavioral['aggregation_rules']['proportion_uncertainty']=='WILSON_95'
          assert behavioral['aggregation_rules']['discovery_min_n_from_frozen_p002']==30
          assert behavioral['existing_intelligence_bridge']['target_existing_domain']=='TEMPORAL_SCORING_DEFENDING'
          assert behavioral['existing_intelligence_bridge']['automatic_injection'] is False
          assert behavioral['existing_intelligence_bridge']['decision_weight']==0
          assert behavioral['psychology_boundary']['psychology_label_is_feature'] is False
          assert behavioral['governance']['market_data_used'] is False
          assert behavioral['governance']['predictive_weight_assigned'] is False
          assert behavioral['governance']['automatic_pattern_promotion'] is False
          assert behavioral['governance']['p002_changed'] is False
          assert behavioral['governance']['real_money']=='NO'

          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['discovery_min_n']==30
          assert p002['independent_validation_min_n']==30
          assert p002['o25_max']==1.60
          assert p002['u35_min']==1.55
          assert p002['u35_max']==1.75
          assert p002['lambda_min']==2.70
          assert p002['lambda_max']==3.10
          assert p002['raw_model_edge_pp_min']==5.0
          assert p002['lineup_lambda_adjustment']==0.10
          print('STEP0_TO_STEP3_CONTRACT_CHAIN=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Verify existing intelligence bridge exists but remains inactive
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { TEAM_MATCH_INTELLIGENCE_DOMAINS } from './packages/intelligence-engine/src/team-match-feature-signals.mjs';
          assert.equal(TEAM_MATCH_INTELLIGENCE_DOMAINS.includes('TEMPORAL_SCORING_DEFENDING'), true);
          console.log('EXISTING_TEMPORAL_SCORING_DEFENDING_DOMAIN=PASS');
          console.log('STEP3_AUTOMATIC_INJECTION=FALSE');
          NODE

      - name: Run Step 1 Match Memory regression
        run: node packages/intelligence-engine/tests/canonical-match-memory.test.mjs

      - name: Run Step 2 Game-State Timeline regression
        run: node packages/intelligence-engine/tests/game-state-timeline.test.mjs

      - name: Run Step 3 Behavioral State Features tests
        run: node packages/intelligence-engine/tests/behavioral-state-features.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/behavioral-state-features-v0.1
          rm -rf /tmp/step3-base /tmp/step3-head
          git worktree add --detach /tmp/step3-base "$BASE"
          git worktree add --detach /tmp/step3-head "$HEAD"

          set +e
          (cd /tmp/step3-base/packages/intelligence-engine && npm test) > /tmp/step3-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step3-head/packages/intelligence-engine && npm test) > /tmp/step3-head.log 2>&1
          HEAD_RC=$?
          set -e

          python - <<'PY'
          import json, re
          from pathlib import Path
          pattern=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          def failures(path):
              out=[]
              for line in Path(path).read_text(errors='replace').splitlines():
                  m=pattern.match(line.strip())
                  if m: out.append(m.group(1).strip())
              return sorted(set(out))
          base=failures('/tmp/step3-base.log')
          head=failures('/tmp/step3-head.log')
          summary={
              'comparison':'CANONICAL_BASE_VS_STEP3_HEAD',
              'base_failure_n':len(base),
              'head_failure_n':len(head),
              'base_failures':base,
              'head_failures':head,
              'new_failure_names':sorted(set(head)-set(base)),
              'removed_failure_names':sorted(set(base)-set(head)),
              'failure_name_delta_zero':base==head,
          }
          Path('artifacts/behavioral-state-features-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          if base != head:
              raise SystemExit('STEP3_REGRESSION_FAILURE_SET_CHANGED')
          PY
          echo "BASE_NPM_TEST_RC=$BASE_RC"
          echo "HEAD_NPM_TEST_RC=$HEAD_RC"
          echo "STEP3_REGRESSION_DELTA=0"

      - name: Write Step 3 test evidence
        run: |
          mkdir -p artifacts/behavioral-state-features-v0.1
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          regression_path=Path('artifacts/behavioral-state-features-v0.1/REGRESSION_BASELINE.json')
          regression=json.loads(regression_path.read_text()) if regression_path.exists() else None
          evidence={
            'artifact':'Behavioral_State_Features_v0.1',
            'step':'STEP_3_BEHAVIORAL_STATE_FEATURES',
            'overall':{
              'TEST_AUTHORED':True,
              'TEST_EXECUTED':True,
              'TEST_PASS':True,
              'STEP_3_COMPLETE':True,
              'FILES_ADDED':5,
              'EXISTING_FILES_MODIFIED':0,
              'EXISTING_FILES_DELETED':0,
              'REGRESSION_DELTA_ZERO':None if regression is None else regression['failure_name_delta_zero']
            },
            'capabilities':{
              'BOTH_TEAM_SIDES_PER_MATCH':True,
              'WIN_DRAW_LOSS_ALL_RETAINED':True,
              'LEAD_OPPORTUNITY_DENOMINATORS':True,
              'TRAILING_OPPORTUNITY_DENOMINATORS':True,
              'HOME_AWAY_SPLITS':True,
              'OPPONENT_CONTEXT_RETAINED':True,
              'WILSON_95_UNCERTAINTY':True,
              'LATE_GOAL_FEATURES':True,
              'PERIOD_BIN_FEATURES':True,
              'DISMISSAL_CONTEXT_FEATURES':True,
              'INELIGIBLE_INPUT_RETAINED_ZERO_INFLUENCE':True,
              'TAMPER_DETECTION':True,
              'DISCOVERY_MIN_N':30,
              'AUTOMATIC_EXISTING_INTELLIGENCE_INJECTION':False,
              'PREDICTIVE_WEIGHT':0
            },
            'regression_baseline':regression,
            'governance':{
              'MARKET_DATA_USED':False,
              'PSYCHOLOGY_LABEL_AS_TRUTH':False,
              'P002_UNCHANGED':True,
              'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,
              'PATTERN_DISCOVERY_PERFORMED':False,
              'AUTOMATIC_RETUNING':False,
              'AUTOMATIC_PATTERN_PROMOTION':False,
              'CAPITAL_EFFECT':'NONE',
              'REAL_MONEY':'NO'
            },
            'hashes':{
              'contract_sha256':sha('contracts/behavioral-state-features-v0.1.json'),
              'runtime_sha256':sha('packages/intelligence-engine/src/behavioral-state-features.mjs'),
              'test_sha256':sha('packages/intelligence-engine/tests/behavioral-state-features.test.mjs'),
              'docs_sha256':sha('packages/intelligence-engine/docs/BEHAVIORAL_STATE_FEATURES_V0_1.md')
            },
            'next_stage':'STEP_4_PATTERN_DISCOVERY_CANDIDATES'
          }
          Path('artifacts/behavioral-state-features-v0.1/TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-state-features-v0.1-evidence
          path: |
            artifacts/behavioral-state-features-v0.1/TEST_EVIDENCE.json
            artifacts/behavioral-state-features-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
