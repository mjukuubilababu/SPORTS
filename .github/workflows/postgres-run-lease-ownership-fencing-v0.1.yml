name: PostgreSQL Run Lease Ownership Fencing v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
    paths:
      - 'packages/prediction-api/**'
      - 'packages/reference-e2e/**'
      - 'contracts/postgres-run-lease-ownership-fencing-v0.1.json'
      - 'docs/postgres-run-lease-ownership-fencing-v0.1.md'
      - 'manifests/postgres-run-lease-ownership-fencing-v0.1.json'
      - '.github/workflows/postgres-run-lease-ownership-fencing-v0.1.yml'
      - 'scripts/verify_postgres_migrations.py'
      - 'scripts/verify_unified.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-run-lease-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d decision_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/decision_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_isready -h localhost -p 5432 -U postgres -d decision_test
      - name: Apply reference evidence checkpoint and lease migrations
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0002_reference_evidence_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0003_reference_stage_checkpoints_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0004_reference_run_leases_fencing_postgres_v0_1.sql
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT to_regclass('reference_run_leases_v01')::text")" = "reference_run_leases_v01"
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT to_regclass('reference_run_lease_events_v01')::text")" = "reference_run_lease_events_v01"
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT to_regclass('reference_checkpoint_fence_receipts_v01')::text")" = "reference_checkpoint_fence_receipts_v01"
      - name: Install reference E2E dependencies
        working-directory: packages/reference-e2e
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Preserve canonical reference E2E behavior
        working-directory: packages/reference-e2e
        env:
          REFERENCE_EVIDENCE_PERSISTENCE_MODE: disabled
        run: npm run verify
      - name: Run completed run PostgreSQL evidence regression
        working-directory: packages/reference-e2e
        run: npm run test:postgres
      - name: Run checkpoint crash recovery regression
        working-directory: packages/reference-e2e
        run: node --test tests/postgres-checkpoint-recovery.integration.mjs
      - name: Run lease ownership and stale worker fencing integration
        working-directory: packages/reference-e2e
        run: node --test tests/postgres-run-lease-fencing.integration.mjs
      - name: Verify lease evidence and fence receipts
        run: |
          lease_rows="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_run_leases_v01")"
          takeover_rows="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_run_lease_events_v01 WHERE event_type='TAKEN_OVER_AFTER_EXPIRY'")"
          receipt_rows="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_checkpoint_fence_receipts_v01")"
          token2_receipts="$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT count(*) FROM reference_checkpoint_fence_receipts_v01 WHERE fencing_token=2")"
          test "$lease_rows" -ge 1
          test "$takeover_rows" -ge 1
          test "$receipt_rows" -ge 11
          test "$token2_receipts" -ge 8
      - name: Re-run existing PostgreSQL migration assurance
        run: python scripts/verify_postgres_migrations.py
      - name: Run intelligence engine regression
        working-directory: packages/intelligence-engine
        run: |
          node --test tests/model-probability-orchestrator.test.mjs
          node --test tests/outcome-1x2.test.mjs
      - name: Install Prediction API dependencies for unified verifier
        working-directory: packages/prediction-api
        run: npm install --no-audit --no-fund
      - name: Apply canonical lineage and Prediction API migrations for unified verifier
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0005_ingestion_provenance_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0006_feature_model_frozen_signal_lineage_postgres_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0007_feature_model_signal_lineage_review_fixes_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0008_frozen_signal_prediction_api_reference_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/reference-e2e/migrations/0009_downstream_lineage_attestation_feature_payload_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/prediction-api/migrations/0015_prediction_snapshots_v0_1.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/prediction-api/migrations/0016_prediction_frozen_signal_lineage_v0_1.sql
          test "$(psql "$TEST_DATABASE_URL" -qAt -c "SELECT to_regclass('prediction_snapshot_frozen_signal_lineage_v01')::text")" = "prediction_snapshot_frozen_signal_lineage_v01"
      - name: Run unified repository verifier
        id: unified
        continue-on-error: true
        run: python scripts/verify_unified.py
      - name: Enforce unified repository verifier with diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/unified-verification-report.json').read_text())
          failed=[x['name'] for x in report['results'] if not x['passed']]
          print(json.dumps({'failed':failed},indent=2))
          assert report['core_integrated_assurance']=='PROMOTE'
          assert report['capital_assurance']=='LOCKED'
          PY
      - name: Write run lease fencing verification evidence
        run: |
          mkdir -p artifacts/postgres-run-lease-fencing
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          def scalar(sql):
              return subprocess.check_output(['psql','postgresql://postgres:postgres@localhost:5432/decision_test','-qAt','-c',sql],text=True).strip()
          migration=json.loads(Path('artifacts/migrations/postgres-migration-verification.json').read_text())
          unified=json.loads(Path('artifacts/unified-verification-report.json').read_text())
          report={
            'version':'v0.1','decision':'PASS','database':'PostgreSQL 16 ephemeral CI',
            'lease_rows':int(scalar('SELECT count(*) FROM reference_run_leases_v01')),
            'lease_event_rows':int(scalar('SELECT count(*) FROM reference_run_lease_events_v01')),
            'takeover_rows':int(scalar("SELECT count(*) FROM reference_run_lease_events_v01 WHERE event_type='TAKEN_OVER_AFTER_EXPIRY'")),
            'fence_receipt_rows':int(scalar('SELECT count(*) FROM reference_checkpoint_fence_receipts_v01')),
            'stale_worker_rejected':True,'expired_lease_takeover_verified':True,
            'monotonic_fencing_token_verified':True,'checkpoint_receipt_token_split_verified':True,
            'lease_history_immutable':True,'checkpoint_receipts_immutable':True,
            'existing_postgres_migration_assurance':migration['decision'],
            'unified_core_assurance':unified['core_integrated_assurance'],
            'capital_state':'LOCKED','real_money':'NO'
          }
          assert report['takeover_rows'] >= 1
          assert report['fence_receipt_rows'] >= 11
          assert migration['decision']=='PASS'
          assert unified['core_integrated_assurance']=='PROMOTE'
          assert unified['capital_assurance']=='LOCKED'
          Path('artifacts/postgres-run-lease-fencing/verification.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload PostgreSQL run lease fencing evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgres-run-lease-ownership-fencing-v0.1
          path: |
            artifacts/postgres-run-lease-fencing/verification.json
            artifacts/migrations/postgres-migration-verification.json
            artifacts/unified-verification-report.json
            contracts/postgres-run-lease-ownership-fencing-v0.1.json
            manifests/postgres-run-lease-ownership-fencing-v0.1.json
          if-no-files-found: error
