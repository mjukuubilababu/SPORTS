name: API-Football Real Runtime Verification

on:
  workflow_dispatch:
    inputs:
      competitions:
        description: 'Canonical competitions, comma-separated'
        required: true
        default: 'EPL,LA_LIGA,SERIE_A,BUNDESLIGA,LIGUE_1'
        type: string
  push:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
    paths:
      - 'runtime-triggers/api-football/**'

permissions:
  contents: write

concurrency:
  group: api-football-real-runtime-verification
  cancel-in-progress: false

jobs:
  verify-authenticated-provider-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require canonical branch
        run: |
          if [ "$GITHUB_REF_NAME" != "import/decision-intelligence-v0.5-qualified-set" ]; then
            echo "::error::Run this verification from the canonical branch only."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect APISPORTS_KEY availability without exposing it
        id: credential
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          if [ -n "$APISPORTS_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Credential availability: configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Credential availability: not configured."
          fi

      - name: Resolve competitions
        env:
          INPUT_COMPETITIONS: ${{ inputs.competitions }}
        run: |
          if [ -n "$INPUT_COMPETITIONS" ]; then
            COMPETITIONS="$INPUT_COMPETITIONS"
          else
            COMPETITIONS='EPL,LA_LIGA,SERIE_A,BUNDESLIGA,LIGUE_1'
          fi
          echo "COMPETITIONS=$COMPETITIONS" >> "$GITHUB_ENV"
          echo "Resolved canonical competition set."

      - name: Fetch authenticated provider response
        id: provider_fetch
        if: steps.credential.outputs.available == 'true'
        continue-on-error: true
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          python scripts/run_api_football_live_ingestion.py \
            artifacts/api-football-real-runtime-v0.1.json \
            --competitions "$COMPETITIONS"

      - name: Verify sanitized provider artifact
        id: artifact_verify
        if: steps.provider_fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/verify_api_football_runtime_artifact.py artifacts/api-football-real-runtime-v0.1.json

      - name: Run unified repository verifier
        id: unified
        if: always()
        continue-on-error: true
        run: python scripts/verify_unified.py

      - name: Write sanitized persistent runtime evidence
        id: evidence
        if: always()
        env:
          RUNTIME_CREDENTIAL_AVAILABLE: ${{ steps.credential.outputs.available }}
          RUNTIME_PROVIDER_FETCH_OUTCOME: ${{ steps.provider_fetch.outcome }}
          RUNTIME_ARTIFACT_VERIFY_OUTCOME: ${{ steps.artifact_verify.outcome }}
          RUNTIME_UNIFIED_OUTCOME: ${{ steps.unified.outcome }}
        run: |
          python scripts/write_api_football_runtime_evidence.py \
            --runtime-artifact artifacts/api-football-real-runtime-v0.1.json \
            --unified-report artifacts/unified-verification-report.json \
            --output-dir runtime-evidence/api-football

      - name: Upload sanitized summary evidence
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: api-football-runtime-summary-v0.1
          path: runtime-evidence/api-football/
          if-no-files-found: error

      - name: Upload detailed successful runtime evidence
        if: steps.provider_fetch.outcome == 'success' && steps.artifact_verify.outcome == 'success' && steps.unified.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: api-football-real-runtime-v0.1
          path: |
            artifacts/api-football-real-runtime-v0.1.json
            artifacts/unified-verification-report.json
            artifacts/unified-verification.log
          if-no-files-found: error

      - name: Persist sanitized summary to canonical repository
        if: always() && steps.evidence.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-evidence/api-football/
          git commit -m "Record API-Football runtime evidence ${GITHUB_RUN_ID}"
          git reset --hard HEAD
          git clean -fd artifacts/ || true
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Enforce successful authenticated runtime gate
        if: always() && steps.evidence.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('runtime-evidence/api-football/latest.json').read_text())
          allowed={
            'VERIFIED_AUTHENTICATED_PROVIDER_RUNTIME_ZERO_LIVE',
            'VERIFIED_AUTHENTICATED_PROVIDER_RUNTIME_WITH_LIVE_CAPTURE',
          }
          print(json.dumps({
            'state':evidence['state'],
            'failure_class':evidence['failure_class'],
            'live_match_captured':evidence['provider_evidence']['live_match_captured'],
            'capital_assurance':evidence['assurance']['capital_assurance'],
          },indent=2))
          if evidence['state'] not in allowed:
            raise SystemExit(1)
          if evidence['assurance']['capital_assurance'] != 'LOCKED':
            raise SystemExit(1)
          PY
