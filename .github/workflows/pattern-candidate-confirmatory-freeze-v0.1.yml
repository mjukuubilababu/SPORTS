name: Pattern Candidate Confirmatory Freeze v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pattern-candidate-confirmatory-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce Step 5 introduction scope or protect Step 5 artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          printf '%s\n' "${rows[@]}"
          owned=(
            "contracts/pattern-candidate-confirmatory-freeze-v0.1.json"
            "packages/intelligence-engine/src/pattern-candidate-confirmatory-freeze.mjs"
            "packages/intelligence-engine/tests/pattern-candidate-confirmatory-freeze.test.mjs"
            "packages/intelligence-engine/docs/PATTERN_CANDIDATE_CONFIRMATORY_FREEZE_V0_1.md"
            ".github/workflows/pattern-candidate-confirmatory-freeze-v0.1.yml"
          )
          if ! git cat-file -e "$BASE:contracts/pattern-candidate-confirmatory-freeze-v0.1.json" 2>/dev/null; then
            declare -A seen=()
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"; matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" == "A" ]] || { echo "STEP5_INTRODUCTION_FILE_MUST_BE_ADDED: $row"; exit 1; }
                  seen["$path"]=1; matched=true; break
                fi
              done
              [[ "$matched" == true ]] || { echo "STEP5_UNEXPECTED_INTRODUCTION_CHANGE: $row"; exit 1; }
            done
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP5_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP5_INTRODUCTION_FILE_SET_INCOMPLETE"; exit 1; }
            echo "STEP5_INTRODUCTION_SCOPE=PASS"
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  case "$status" in D|R*) echo "STEP5_OWNED_ARTIFACT_DELETION_OR_RENAME_FORBIDDEN: $row"; exit 1 ;; esac
                fi
              done
            done
            echo "STEP5_FORWARD_COMPATIBILITY_PROTECTOR=PASS"
          fi

      - name: Validate Step 0-5 contracts and frozen governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          step4=json.loads(Path('contracts/pattern-discovery-candidates-v0.1.json').read_text())
          step5=json.loads(Path('contracts/pattern-candidate-confirmatory-freeze-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          assert step4['contract_id']=='PATTERN_DISCOVERY_CANDIDATES_V0_1'
          assert step4['status']=='STEP_4_IMPLEMENTED'
          assert step4['next_stage']=='STEP_5_PATTERN_CANDIDATE_CONFIRMATORY_FREEZE'
          assert step5['contract_id']=='PATTERN_CANDIDATE_CONFIRMATORY_FREEZE_V0_1'
          assert step5['status']=='STEP_5_IMPLEMENTED'
          assert step5['depends_on']['pattern_discovery_candidates']==step4['contract_id']
          assert step5['freeze_policy']['freeze_entire_step4_candidate_batch'] is True
          assert step5['freeze_policy']['manual_candidate_subset_selection_allowed'] is False
          assert step5['anti_hindsight']['all_step4_subject_and_reference_match_ids_forbidden_in_confirmatory_evidence'] is True
          assert step5['confirmatory_plan']['minimum_practical_effect_absolute']==0.10
          assert step5['confirmatory_plan']['subject_match_n_min']==30
          assert step5['confirmatory_plan']['subject_metric_opportunity_n_min']==30
          assert step5['confirmatory_plan']['reference_metric_opportunity_n_min']==30
          assert step5['multiple_testing_control']['familywise_alpha']==0.05
          assert step5['multiple_testing_control']['method']=='HOLM_BONFERRONI'
          assert step5['multiple_testing_control']['significance_test_run_in_step5'] is False
          assert step5['result_boundary']['pattern_validation_performed_in_step5'] is False
          assert step5['result_boundary']['decision_weight']==0
          assert step5['governance']['p002_changed'] is False
          assert step5['governance']['gate1_to_gate6_ownership_changed'] is False
          assert step5['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['discovery_min_n']==30
          assert p002['independent_validation_min_n']==30
          assert p002['capital_effect']=='NONE_UNTIL_GOVERNED_EVIDENCE'
          print('STEP0_TO_STEP5_CONTRACT_CHAIN=PASS')
          print('WHOLE_BATCH_FREEZE=PASS')
          print('DISJOINT_CONFIRMATORY_BOUNDARY=PASS')
          print('HOLM_PLAN_PREREGISTERED_NOT_RUN=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Run Step 4 regression
        run: node --test packages/intelligence-engine/tests/pattern-discovery-candidates.test.mjs

      - name: Run Step 5 tests
        run: node --test packages/intelligence-engine/tests/pattern-candidate-confirmatory-freeze.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/pattern-candidate-confirmatory-freeze-v0.1
          rm -rf /tmp/step5-base /tmp/step5-head
          git worktree add --detach /tmp/step5-base "$BASE"
          git worktree add --detach /tmp/step5-head "$HEAD"
          set +e
          (cd /tmp/step5-base/packages/intelligence-engine && npm test) > /tmp/step5-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step5-head/packages/intelligence-engine && npm test) > /tmp/step5-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s\n' "$BASE_RC" > /tmp/step5-base.rc
          printf '%s\n' "$HEAD_RC" > /tmp/step5-head.rc
          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          def failures(path):
            out=[]
            for line in Path(path).read_text(errors='replace').splitlines():
              text=line.strip(); m=tap.match(text) or glyph.match(text)
              if m: out.append(m.group(1).strip())
            return sorted(set(out))
          brc=int(Path('/tmp/step5-base.rc').read_text()); hrc=int(Path('/tmp/step5-head.rc').read_text())
          base=failures('/tmp/step5-base.log'); head=failures('/tmp/step5-head.log')
          if brc!=0 and not base: raise SystemExit('STEP5_UNPARSED_CANONICAL_BASE_TEST_FAILURE_DEBT')
          if hrc!=0 and not head: raise SystemExit('STEP5_UNPARSED_HEAD_TEST_FAILURE_DEBT')
          if brc!=hrc: raise SystemExit('STEP5_NPM_TEST_EXIT_CODE_CHANGED')
          if base!=head: raise SystemExit('STEP5_REGRESSION_FAILURE_SET_CHANGED')
          summary={'comparison':'CANONICAL_BASE_VS_STEP5_HEAD','node_version':'20','base_npm_test_rc':brc,'head_npm_test_rc':hrc,'npm_test_rc_parity':brc==hrc,'base_failure_n':len(base),'head_failure_n':len(head),'base_failures':base,'head_failures':head,'new_failure_names':sorted(set(head)-set(base)),'removed_failure_names':sorted(set(base)-set(head)),'failure_name_delta_zero':base==head,'canonical_baseline_has_existing_failures':brc!=0}
          Path('artifacts/pattern-candidate-confirmatory-freeze-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          echo "STEP5_REGRESSION_DELTA=0"

      - name: Write Step 5 test evidence
        run: |
          mkdir -p artifacts/pattern-candidate-confirmatory-freeze-v0.1
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          rp=Path('artifacts/pattern-candidate-confirmatory-freeze-v0.1/REGRESSION_BASELINE.json')
          regression=json.loads(rp.read_text()) if rp.exists() else None
          evidence={
            'artifact':'Pattern_Candidate_Confirmatory_Freeze_v0.1',
            'step':'STEP_5_PATTERN_CANDIDATE_CONFIRMATORY_FREEZE',
            'overall':{'TEST_AUTHORED':True,'TEST_EXECUTED':True,'TEST_PASS':True,'STEP_5_COMPLETE':True,'ADDED_FILES':5,'MODIFIED_EXISTING_FILES':0,'DELETED_EXISTING_FILES':0,'REGRESSION_DELTA_ZERO':None if regression is None else regression['failure_name_delta_zero']},
            'capabilities':{'FREEZE_ENTIRE_STEP4_CANDIDATE_BATCH':True,'MANUAL_SUBSET_ALLOWED':False,'POST_DISCOVERY_CHERRY_PICKING_ALLOWED':False,'CONFIRMATORY_START_NEXT_UTC_DATE':True,'DISCOVERY_AND_REFERENCE_MATCH_REUSE_FORBIDDEN':True,'SUBJECT_MATCH_MIN_N':30,'SUBJECT_OPPORTUNITY_MIN_N':30,'REFERENCE_OPPORTUNITY_MIN_N':30,'MINIMUM_PRACTICAL_EFFECT':0.10,'FAMILYWISE_ALPHA':0.05,'MULTIPLE_TESTING_METHOD':'HOLM_BONFERRONI','SIGNIFICANCE_TEST_RUN':False,'PATTERN_VALIDATION_PERFORMED':False,'PREDICTIVE_WEIGHT':0},
            'regression_baseline':regression,
            'governance':{'P002_UNCHANGED':True,'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,'AUTOMATIC_RETUNING':False,'AUTOMATIC_PATTERN_PROMOTION':False,'CAPITAL_EFFECT':'NONE','REAL_MONEY':'NO'},
            'hashes':{'contract_sha256':sha('contracts/pattern-candidate-confirmatory-freeze-v0.1.json'),'runtime_sha256':sha('packages/intelligence-engine/src/pattern-candidate-confirmatory-freeze.mjs'),'test_sha256':sha('packages/intelligence-engine/tests/pattern-candidate-confirmatory-freeze.test.mjs'),'docs_sha256':sha('packages/intelligence-engine/docs/PATTERN_CANDIDATE_CONFIRMATORY_FREEZE_V0_1.md'),'p002_sha256':sha('contracts/p002-frozen-rules.json')},
            'next_stage':'STEP_6_PATTERN_CONFIRMATORY_OUT_OF_SAMPLE_EVALUATION'
          }
          Path('artifacts/pattern-candidate-confirmatory-freeze-v0.1/TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pattern-candidate-confirmatory-freeze-v0.1-evidence
          path: |
            artifacts/pattern-candidate-confirmatory-freeze-v0.1/TEST_EVIDENCE.json
            artifacts/pattern-candidate-confirmatory-freeze-v0.1/REGRESSION_BASELINE.json
          if-no-files-found: error
