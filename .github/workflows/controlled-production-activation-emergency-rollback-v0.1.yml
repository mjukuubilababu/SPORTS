name: Controlled Production Activation Emergency Rollback v0.1

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
  push:
    branches:
      - feature/controlled-production-activation-emergency-rollback-v0.1
      - import/decision-intelligence-v0.5-qualified-set

permissions:
  contents: read

jobs:
  validate-controlled-production-activation-emergency-rollback:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve canonical comparison range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_REF_NAME}" == "feature/controlled-production-activation-emergency-rollback-v0.1" ]]; then
            git fetch --no-tags origin import/decision-intelligence-v0.5-qualified-set:refs/remotes/origin/import/decision-intelligence-v0.5-qualified-set
            BASE="$(git merge-base HEAD origin/import/decision-intelligence-v0.5-qualified-set)"
            HEAD="${GITHUB_SHA}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${GITHUB_SHA}"
          fi
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$HEAD^{commit}"
          echo "STEP15_BASE=$BASE" >> "$GITHUB_ENV"
          echo "STEP15_HEAD=$HEAD" >> "$GITHUB_ENV"
          echo "STEP15_COMPARISON_BASE=$BASE"
          echo "STEP15_COMPARISON_HEAD=$HEAD"

      - name: Enforce Step 15 introduction scope or protect Step 15 artifacts
        shell: bash
        run: |
          set -euo pipefail
          BASE="$STEP15_BASE"
          HEAD="$STEP15_HEAD"
          mapfile -t rows < <(git diff --name-status "$BASE" "$HEAD")
          owned=(
            "contracts/controlled-production-activation-emergency-rollback-v0.1.json"
            "packages/intelligence-engine/src/controlled-production-activation-emergency-rollback.mjs"
            "packages/intelligence-engine/tests/controlled-production-activation-emergency-rollback.test.mjs"
            "packages/intelligence-engine/docs/CONTROLLED_PRODUCTION_ACTIVATION_EMERGENCY_ROLLBACK_V0_1.md"
            ".github/workflows/controlled-production-activation-emergency-rollback-v0.1.yml"
          )
          if ! git cat-file -e "$BASE:contracts/controlled-production-activation-emergency-rollback-v0.1.json" 2>/dev/null; then
            declare -A seen=()
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"; matched=false
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  [[ "$status" == "A" ]] || { echo "STEP15_INTRODUCTION_FILE_MUST_BE_ADDED: $row"; exit 1; }
                  seen["$path"]=1; matched=true; break
                fi
              done
              [[ "$matched" == true ]] || { echo "STEP15_UNEXPECTED_INTRODUCTION_CHANGE: $row"; exit 1; }
            done
            [[ "${#rows[@]}" -eq 5 ]] || { echo "STEP15_EXPECTED_EXACTLY_5_ADDITIONS"; exit 1; }
            [[ "${#seen[@]}" -eq 5 ]] || { echo "STEP15_INTRODUCTION_FILE_SET_INCOMPLETE"; exit 1; }
          else
            for row in "${rows[@]}"; do
              status="${row%%$'\t'*}"; path="${row#*$'\t'}"
              for item in "${owned[@]}"; do
                if [[ "$path" == "$item" ]]; then
                  case "$status" in D|R*) echo "STEP15_OWNED_ARTIFACT_DELETION_OR_RENAME_FORBIDDEN: $row"; exit 1 ;; esac
                fi
              done
            done
          fi
          echo "STEP15_SCOPE_GUARD=PASS"

      - name: Validate Step 14-15 contracts, P002 and Gate6 ownership
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s14=json.loads(Path('contracts/zero-weight-challenger-promotion-authorization-production-safety-review-v0.1.json').read_text())
          s15=json.loads(Path('contracts/controlled-production-activation-emergency-rollback-v0.1.json').read_text())
          p002=json.loads(Path('contracts/p002-frozen-rules.json').read_text())
          g6=json.loads(Path('packages/gate6/gate6_manifest.json').read_text())
          assert s14['status']=='STEP_14_IMPLEMENTED'
          assert s14['next_stage_on_approval']=='STEP_15_CONTROLLED_PRODUCTION_ACTIVATION_AND_EMERGENCY_ROLLBACK'
          assert s15['contract_id']=='CONTROLLED_PRODUCTION_ACTIVATION_EMERGENCY_ROLLBACK_V0_1'
          assert s15['status']=='STEP_15_IMPLEMENTED'
          assert s15['inputs']['required_step14_decision']=='APPROVE_FOR_CONTROLLED_PRODUCTION_ACTIVATION_NOT_ACTIVATED'
          assert s15['inputs']['all_step14_safety_controls_must_pass'] is True
          assert s15['activation_boundary']['maximum_initial_production_decision_weight']==0.05
          assert s15['activation_boundary']['maximum_absolute_probability_shift']==0.02
          assert s15['activation_boundary']['probability_shift_cap_increased_from_canary'] is False
          assert s15['activation_boundary']['champion_replacement_authorized'] is False
          assert s15['activation_boundary']['capital_execution_authorized'] is False
          assert s15['activation_boundary']['automatic_weight_ramp'] is False
          assert s15['activation_boundary']['automatic_retuning'] is False
          assert s15['activation_boundary']['kill_switch_must_be_armed_before_activation'] is True
          assert s15['prediction_boundary']['production_prediction_mutation_allowed'] is True
          assert s15['prediction_boundary']['post_event_start_prediction_mutation_allowed'] is False
          assert s15['prediction_boundary']['capital_execution_allowed'] is False
          assert s15['prospective_health']['minimum_settled_n']==30
          assert s15['prospective_health']['maximum_ece_degradation']==0.01
          assert s15['prospective_health']['graduation_evidence_reuse_as_new_production_proof'] is False
          assert s15['emergency_rollback']['rollback_target']=='CHAMPION_ONLY'
          assert s15['emergency_rollback']['production_decision_weight_after_rollback']==0
          assert s15['emergency_rollback']['probability_influence_after_rollback']==0
          assert s15['emergency_rollback']['same_activation_reactivation_allowed'] is False
          assert 'GATE6_CAPITAL_LOCK_VIOLATION' in s15['emergency_rollback']['immediate_signals']
          assert s15['evaluation_firewall']['automatic_weight_increase_from_step15_health'] is False
          assert s15['real_evidence_boundary']['synthetic_unit_test_rows_may_count_as_real_step15_evidence'] is False
          assert s15['governance']['p002_changed'] is False
          assert s15['governance']['gate1_to_gate6_ownership_changed'] is False
          assert s15['governance']['gate6_capital_lock_preserved'] is True
          assert s15['governance']['champion_replacement_authorized'] is False
          assert s15['governance']['real_money']=='NO'
          assert p002['lineage']=='P002'
          assert p002['status']=='FROZEN_RESEARCH_RULE'
          assert p002['independent_validation_min_n']==30
          assert p002['capital_effect']=='NONE_UNTIL_GOVERNED_EVIDENCE'
          assert g6['gate']=='Gate 6 — Capital & Risk Engine'
          assert 'LOCKED' in g6['capital_modes']
          print('STEP14_TO_STEP15_CONTRACT_CHAIN=PASS')
          print('STEP15_INITIAL_WEIGHT_CAP_5_PERCENT=PASS')
          print('STEP15_PROBABILITY_SHIFT_CAP_2PP=PASS')
          print('STEP15_EMERGENCY_ROLLBACK_CHAMPION_ONLY=PASS')
          print('STEP15_CAPITAL_EXECUTION_LOCKED=PASS')
          print('GATE6_CAPITAL_OWNER_PRESERVED=PASS')
          print('P002_UNCHANGED=PASS')
          PY

      - name: Run Step 10 regression
        run: node --test packages/intelligence-engine/tests/controlled-pattern-canary-activation-rollback.test.mjs

      - name: Run Step 11 regression
        run: node --test packages/intelligence-engine/tests/pattern-canary-expansion-rejection-governance.test.mjs

      - name: Run Step 12 regression
        run: node --test packages/intelligence-engine/tests/staged-pattern-canary-expansion-activation-monitoring.test.mjs

      - name: Run Step 13 regression
        run: node --test packages/intelligence-engine/tests/pattern-canary-graduation-retirement-governance.test.mjs

      - name: Run Step 14 regression
        run: node --test packages/intelligence-engine/tests/zero-weight-challenger-promotion-authorization-production-safety-review.test.mjs

      - name: Run Step 15 tests
        run: node --test packages/intelligence-engine/tests/controlled-production-activation-emergency-rollback.test.mjs

      - name: Compare full intelligence-engine regression against canonical base
        shell: bash
        run: |
          set -euo pipefail
          BASE="$STEP15_BASE"
          HEAD="$STEP15_HEAD"
          mkdir -p artifacts/controlled-production-activation-emergency-rollback-v0.1
          rm -rf /tmp/step15-base /tmp/step15-head
          git worktree add --detach /tmp/step15-base "$BASE"
          git worktree add --detach /tmp/step15-head "$HEAD"
          set +e
          (cd /tmp/step15-base/packages/intelligence-engine && npm test) > /tmp/step15-base.log 2>&1
          BASE_RC=$?
          (cd /tmp/step15-head/packages/intelligence-engine && npm test) > /tmp/step15-head.log 2>&1
          HEAD_RC=$?
          set -e
          printf '%s\n' "$BASE_RC" > /tmp/step15-base.rc
          printf '%s\n' "$HEAD_RC" > /tmp/step15-head.rc
          python - <<'PY'
          import json,re
          from pathlib import Path
          tap=re.compile(r'^not ok\s+\d+\s+-\s+(.+)$')
          glyph=re.compile(r'^[✖×]\s+(.+?)(?:\s+\(|$)')
          def failures(path):
            out=[]
            for line in Path(path).read_text(errors='replace').splitlines():
              t=line.strip(); m=tap.match(t) or glyph.match(t)
              if m: out.append(m.group(1).strip())
            return sorted(set(out))
          brc=int(Path('/tmp/step15-base.rc').read_text()); hrc=int(Path('/tmp/step15-head.rc').read_text())
          base=failures('/tmp/step15-base.log'); head=failures('/tmp/step15-head.log')
          if brc!=0 and not base: raise SystemExit('STEP15_UNPARSED_CANONICAL_BASE_TEST_FAILURE_DEBT')
          if hrc!=0 and not head: raise SystemExit('STEP15_UNPARSED_HEAD_TEST_FAILURE_DEBT')
          if brc!=hrc: raise SystemExit('STEP15_NPM_TEST_EXIT_CODE_CHANGED')
          if base!=head: raise SystemExit('STEP15_REGRESSION_FAILURE_SET_CHANGED')
          summary={'comparison':'CANONICAL_BASE_VS_STEP15_HEAD','node_version':'20','base_npm_test_rc':brc,'head_npm_test_rc':hrc,'base_failure_n':len(base),'head_failure_n':len(head),'base_failures':base,'head_failures':head,'new_failure_names':sorted(set(head)-set(base)),'removed_failure_names':sorted(set(base)-set(head)),'failure_name_delta_zero':base==head}
          Path('artifacts/controlled-production-activation-emergency-rollback-v0.1/REGRESSION_BASELINE.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          echo "STEP15_REGRESSION_DELTA=0"

      - name: Write Step 15 evidence
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          root=Path('artifacts/controlled-production-activation-emergency-rollback-v0.1')
          root.mkdir(parents=True,exist_ok=True)
          regression=json.loads((root/'REGRESSION_BASELINE.json').read_text())
          evidence={
            'artifact':'Controlled_Production_Activation_Emergency_Rollback_v0.1',
            'step':'STEP_15_CONTROLLED_PRODUCTION_ACTIVATION_AND_EMERGENCY_ROLLBACK',
            'overall':{'TEST_AUTHORED':True,'TEST_EXECUTED':True,'TEST_PASS':True,'STEP_15_IMPLEMENTATION_COMPLETE':True,'ADDED_FILES':5,'MODIFIED_EXISTING_FILES':0,'DELETED_EXISTING_FILES':0,'REGRESSION_DELTA_ZERO':regression['failure_name_delta_zero']},
            'capabilities':{'EXACT_STEP14_APPROVAL_REQUIRED':True,'MAX_INITIAL_PRODUCTION_DECISION_WEIGHT':0.05,'MAX_ABSOLUTE_PROBABILITY_SHIFT':0.02,'PRODUCTION_PREDICTION_MUTATION_ALLOWED':True,'CAPITAL_EXECUTION_ALLOWED':False,'CHAMPION_REPLACEMENT_AUTHORIZED':False,'KILL_SWITCH_ARMED_BEFORE_ACTIVATION':True,'MIN_PROSPECTIVE_SETTLED_N':30,'MAX_ECE_DEGRADATION':0.01,'AUTOMATIC_WEIGHT_RAMP':False,'AUTOMATIC_RETUNING':False,'EMERGENCY_ROLLBACK_TARGET':'CHAMPION_ONLY','ROLLBACK_DECISION_WEIGHT':0,'ROLLBACK_PROBABILITY_INFLUENCE':0},
            'real_evidence_status':{'REAL_STEP15_ACTIVATION_EXECUTED_IN_CI':False,'SYNTHETIC_TEST_FIXTURES_ONLY':True,'SYNTHETIC_RESULTS_COUNT_AS_REAL_STEP15_EVIDENCE':False,'REAL_STEP15_ACTIVATION_CLAIMED':False,'CURRENT_REAL_STATUS':'NOT_RUN_WAITING_FOR_REAL_STEP14_APPROVAL_AND_PROSPECTIVE_CONTROLLED_PRODUCTION_EVIDENCE'},
            'regression_baseline':regression,
            'governance':{'P002_UNCHANGED':True,'GATE1_TO_GATE6_OWNERSHIP_CHANGED':False,'GATE6_CAPITAL_OWNER_PRESERVED':True,'CHAMPION_REPLACEMENT_AUTHORIZED':False,'AUTOMATIC_PROMOTION':False,'AUTOMATIC_RETUNING':False,'CAPITAL_EFFECT':'NONE','REAL_MONEY':'NO'},
            'hashes':{'contract_sha256':sha('contracts/controlled-production-activation-emergency-rollback-v0.1.json'),'runtime_sha256':sha('packages/intelligence-engine/src/controlled-production-activation-emergency-rollback.mjs'),'test_sha256':sha('packages/intelligence-engine/tests/controlled-production-activation-emergency-rollback.test.mjs'),'docs_sha256':sha('packages/intelligence-engine/docs/CONTROLLED_PRODUCTION_ACTIVATION_EMERGENCY_ROLLBACK_V0_1.md'),'p002_sha256':sha('contracts/p002-frozen-rules.json'),'gate6_manifest_sha256':sha('packages/gate6/gate6_manifest.json')},
            'next_stage_on_healthy_evidence':'STEP_16_CONTROLLED_PRODUCTION_EVIDENCE_REVIEW_AND_WEIGHT_GOVERNANCE'
          }
          (root/'TEST_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload Step 15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: controlled-production-activation-emergency-rollback-v0.1-evidence
          path: artifacts/controlled-production-activation-emergency-rollback-v0.1
