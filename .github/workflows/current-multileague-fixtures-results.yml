name: Current Multi-League Fixtures Results

on:
  pull_request:
    branches:
      - import/decision-intelligence-v0.5-qualified-set
    paths:
      - 'packages/gate1/current_multileague_fixtures_results.py'
      - 'packages/gate1/espn_current_fixture_provider.py'
      - 'packages/gate1/openligadb_bundesliga_verifier.py'
      - 'scripts/test_current_multileague_fixtures_results.py'
      - 'scripts/test_espn_current_fixture_provider.py'
      - 'scripts/test_openligadb_bundesliga_verifier.py'
      - 'scripts/run_current_multileague_discovery.py'
      - 'scripts/verify_unified.py'
      - 'contracts/current-multileague-fixtures-results-v0.1.json'
      - 'docs/current-multileague-fixtures-results-v0.1.md'
      - 'manifests/current-multileague-fixtures-results-v0.1.json'
      - '.github/workflows/current-multileague-fixtures-results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run primary snapshot tests
        run: python scripts/test_current_multileague_fixtures_results.py
      - name: Run secondary discovery adapter tests
        run: python scripts/test_espn_current_fixture_provider.py
      - name: Run Bundesliga cross-source verifier tests
        run: python scripts/test_openligadb_bundesliga_verifier.py
      - name: Discover current 2026/27 sources
        run: python scripts/run_current_multileague_discovery.py artifacts/current-multileague-discovery-v0.1.json
      - name: Assert discovery governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/current-multileague-discovery-v0.1.json').read_text())
          assert report['report_version']=='CURRENT_MULTILEAGUE_SOURCE_DISCOVERY_V0_3'
          assert set(report['leagues']) == {'EPL','LA_LIGA','SERIE_A','BUNDESLIGA','LIGUE_1'}
          assert report['governance']['live_in_play_claimed'] is False
          assert report['governance']['bookmaker_data_used'] is False
          assert report['governance']['provider_prediction_used'] is False
          assert report['governance']['secondary_source_discovery_only_unless_independently_reconciled'] is True
          assert report['governance']['cross_source_agreement_required_for_secondary_strict_gate1'] is True
          assert report['governance']['bundesliga_fuzzy_identity_matching'] is False
          assert report['governance']['complete_strict_truth_coverage_claimed'] is False
          for league,row in report['leagues'].items():
              assert row['availability'] in {'AVAILABLE_PRIMARY','AVAILABLE_SECONDARY_DISCOVERY','AVAILABLE_CROSS_SOURCE_VERIFIED','SECONDARY_AVAILABLE_EMPTY_WINDOW','UNAVAILABLE_OR_UNPARSABLE'}
              assert row['live_in_play_supported'] is False
              assert row['live_in_play_n'] == 0
              assert row['bookmaker_data_used'] is False
              assert row['provider_prediction_used'] is False
              assert row['strict_gate1_rows_n'] >= 0
              if row['availability']=='AVAILABLE_PRIMARY':
                  assert row['rows_n'] > 0
                  assert len(row['raw_sha256']) == 64
                  assert row['strict_gate1_eligible'] is True
                  assert row['strict_gate1_rows_n']==row['rows_n']
              if row['availability']=='AVAILABLE_SECONDARY_DISCOVERY':
                  assert row['rows_n'] > 0
                  assert row['discovery_only'] is True
                  assert row['strict_gate1_eligible'] is False
                  assert row['provider']=='ESPN_SITE_SCOREBOARD'
                  assert all(len(h)==64 for h in row['row_hash_inventory'])
              if row['availability']=='AVAILABLE_CROSS_SOURCE_VERIFIED':
                  assert league=='BUNDESLIGA'
                  assert row['rows_n'] > 0
                  assert row['provider']=='ESPN_X_OPENLIGADB'
                  assert row['discovery_only'] is False
                  assert row['strict_gate1_eligible'] is True
                  assert row['strict_gate1_rows_n']==row['rows_n']
                  verification=row['cross_source_verification']
                  assert verification['status']=='VERIFIED'
                  assert verification['full_window_reconciled'] is True
                  assert verification['reconciled_n']==row['rows_n']
                  assert verification['unmatched_espn_n']==0
                  assert verification['fuzzy_matching'] is False
          bundesliga=report['leagues']['BUNDESLIGA']
          if bundesliga['strict_gate1_eligible']:
              assert bundesliga['cross_source_verification']['full_window_reconciled'] is True
              assert bundesliga['cross_source_verification']['provider']=='OPENLIGADB'
          print(json.dumps({
            'available_n':report['available_n'],
            'primary_available_n':report['primary_available_n'],
            'secondary_discovery_available_n':report['secondary_discovery_available_n'],
            'cross_source_verified_available_n':report['cross_source_verified_available_n'],
            'strict_gate1_eligible_n':report['strict_gate1_eligible_n'],
            'strict_gate1_rows_n':report['strict_gate1_rows_n'],
            'bundesliga_verification':bundesliga.get('cross_source_verification',{}),
            'availability':{k:v['availability'] for k,v in report['leagues'].items()}
          },indent=2))
          PY
      - name: Run unified verifier
        run: python scripts/verify_unified.py
      - name: Assert unified assurance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/unified-verification-report.json').read_text())
          assert report['core_integrated_assurance']=='PROMOTE'
          assert report['tests_total']==report['tests_passed']
          assert report['capital_assurance']=='LOCKED'
          print(json.dumps({'tests':f"{report['tests_passed']}/{report['tests_total']}",'capital':report['capital_assurance']},indent=2))
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-multileague-fixtures-results-v0.1
          path: |
            artifacts/current-multileague-discovery-v0.1.json
            artifacts/unified-verification-report.json
            artifacts/unified-verification.log
            manifests/current-multileague-fixtures-results-v0.1.json
            contracts/current-multileague-fixtures-results-v0.1.json
          if-no-files-found: error
